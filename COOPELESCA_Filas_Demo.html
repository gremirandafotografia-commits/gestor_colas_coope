/* ============================================================================
   VENTANA EMERGENTE DE DETALLE — Resumen/Reportes
   ----------------------------------------------------------------------------
   Clic en una barra o en una fila de las tablas de Reportes (por período, por
   puesto o por funcionario) abre esta ventana con el desglose de ESA porción,
   calculado con el mismo motor (calcularMetricas) que alimenta el reporte
   completo — y desde aquí se puede imprimir o exportar solo ese detalle.
   ========================================================================== */

/** Arma el par de predicados {turno, encuesta} para acotar calcularMetricas()
 *  a un usuario/puesto/trámite/período puntual. Se piden por separado porque
 *  las encuestas no siempre están ligadas a un turno (ver calcularMetricas). */
function filtroDetalle(tipo, clave){
  if (tipo==='usuario'){
    const clv = function(t){ return t.atendidoPor ? usuarioCorto(t.atendidoPor) : (t.puestoNombre||'—'); };
    return {
      turno: function(t){ return clv(t)===clave; },
      encuesta: function(e){ const t=E.turnos.find(function(x){ return x.id===e.turnoId; }); return !!t && clv(t)===clave; }
    };
  }
  if (tipo==='puesto') return {
    turno: function(t){ return t.puestoId===clave; },
    encuesta: function(e){ return e.puestoId===clave; }
  };
  if (tipo==='tramite') return {
    turno: function(t){ return t.tramiteId===clave; },
    encuesta: function(e){ const t=E.turnos.find(function(x){ return x.id===e.turnoId; }); return !!t && t.tramiteId===clave; }
  };
  if (tipo==='periodo'){
    const gran = filtroPeriodo().gran;
    return {
      turno: function(t){ return claveGran(t.horaCreado,gran).k===clave; },
      encuesta: function(e){ return claveGran(e.fecha,gran).k===clave; }
    };
  }
  if (tipo==='kpi'){
    // Cada casilla de resumen que no corresponde a un trámite/puesto/usuario
    // puntual, sino a un subconjunto de fichas del período (las atendidas,
    // las perdidas, las que rompieron el estándar de espera, etc.).
    const PRED = {
      atendidas: function(t){ return t.estado==='finalizado'; },
      perdidas: function(t){ return t.estado==='ausente'; },
      desborde: function(t){ return !!t.desborde; },
      fueraEstandar: function(t){ return !!t.horaAtencion && segDesde(t.horaCreado,t.horaAtencion) > estandarEsperaSeg(t.tramiteId); },
      sinEncuesta: function(t){
        if (t.estado!=='finalizado') return false;
        return !(E.encuestasRespuestas||[]).some(function(e){ return e.turnoId===t.id; });
      },
      conEncuesta: function(t){
        if (t.estado!=='finalizado') return false;
        return (E.encuestasRespuestas||[]).some(function(e){ return e.turnoId===t.id; });
      }
    };
    const pred = PRED[clave];
    if (!pred) return {};
    return {
      turno: pred,
      encuesta: function(e){ const t=E.turnos.find(function(x){ return x.id===e.turnoId; }); return !!t && pred(t); }
    };
  }
  if (tipo==='sensacion'){
    // clave es una calificación (1 a 5) o varias separadas por coma (p.ej.
    // "4,5" para «respuestas positivas») elegidas en la dona de satisfacción
    // o en las casillas de Encuestas: se filtra a las respuestas que
    // incluyan alguna de esas calificaciones, y a los turnos ligados.
    const vals = String(clave).split(',').map(Number);
    const tieneValor = function(e){ return (e.respuestas||[]).some(function(x){ return vals.indexOf(x.valor)>=0; }); };
    return {
      encuesta: tieneValor,
      turno: function(t){ return (E.encuestasRespuestas||[]).some(function(e){ return e.turnoId===t.id && tieneValor(e); }); }
    };
  }
  return {};
}
/** Texto legible para el título de la ventana emergente y del reporte
 *  impreso/exportado que sale de ella. */
function etiquetaDetalle(tipo, clave){
  if (tipo==='usuario') return 'Funcionario — '+clave;
  if (tipo==='puesto'){ const p=puestoPorId(clave); return (p&&p.tipo==='caja'?'Caja — ':'Ventanilla — ')+(p?p.nombre:clave); }
  if (tipo==='tramite'){ const tr=E.tramites.find(function(x){ return x.id===clave; }); return 'Trámite — '+(tr?tr.nombre:clave); }
  if (tipo==='periodo'){
    const gran = filtroPeriodo().gran;
    const s = (analizar().serie||[]).find(function(x){ return x.clave===clave; });
    const pref = gran==='anio' ? 'Año — ' : (gran==='mes' ? 'Mes — ' : 'Día — ');
    return pref+(s?s.etiqueta:clave);
  }
  if (tipo==='kpi'){
    const NOMBRES = {
      atendidas:'Fichas atendidas', perdidas:'Turnos perdidos', desborde:'Fichas por desborde',
      fueraEstandar:'Fuera del estándar de espera', sinEncuesta:'Atendidas sin encuesta',
      conEncuesta:'Atendidas con encuesta'
    };
    return NOMBRES[clave] || String(clave);
  }
  if (tipo==='sensacion'){
    const NOMBRES = {1:'Muy insatisfecho',2:'Insatisfecho',3:'Neutral',4:'Satisfecho',5:'Muy satisfecho'};
    const vals = String(clave).split(',');
    if (vals.length>1) return 'Calificación — '+vals.map(function(v){ return NOMBRES[v]||v; }).join(' y ');
    return 'Calificación — '+(NOMBRES[clave]||clave)+' ('+clave+'/5)';
  }
  if (tipo==='todos') return 'Todo el período analizado';
  return String(clave);
}

/* ============================================================================
   ACCIONES
   ============================================================================ */
/** El servidor asigna folio y consecutivo (con bloqueo de fila, para que dos
 *  kioscos nunca repitan un folio) y, si hay cédula y padrón configurado,
 *  consulta el nombre del asociado en segundo plano por su cuenta — este
 *  archivo ya no necesita hacer esa consulta ni llevar sus propios
 *  contadores locales. */
async function emitirFicha(conCedula){
  const suc = sucKiosco();
  const tr = E.tramites.find(t=>t.id===ui.tramiteId);
  if (!tr) return;
  const cedula = conCedula ? (ui.cedula||'').replace(/\D/g,'') : null;
  try{
    const r = await api('/api/turnos', {method:'POST', body:{
      sucursalId:suc, tramiteId:tr.id, preferencial:!!ui.pref, cedula:cedula||undefined
    }});
    const ficha = mapTurnoDesdeAPI(r);
    ui.ticket = ficha; ui.paso='ticket'; ui.cuenta=SEG_AUTOREGRESO; ui.kioscoError=null;
    reiniciarCuenta();
    pintar();
    // Se imprime el comprobante físico apenas se emite la ficha, como en un
    // kiosco real. El botón "Imprimir ficha" en pantalla queda como respaldo
    // manual por si el navegador bloquea la ventana de impresión automática.
    imprimirTicket(ficha, (E.sucursales.find(s=>s.id===suc)||{}).nombre||'');
  }catch(e){
    ui.kioscoError = e.message || 'No se pudo emitir la ficha. Intente de nuevo.';
    pintar();
  }
}

/** Vuelve a pedir la cola de la sucursal para mostrar "N personas en
 *  espera" en la pantalla de bienvenida del kiosco — nunca se muestra la
 *  cola en sí, solo su tamaño. */
async function refrescarKiosco(){
  try{ const cola = await api('/api/sucursales/'+sucKiosco()+'/cola'); ui.kioscoEnCola = cola.length; }
  catch(e){ console.error('No se pudo refrescar el kiosco', e); }
}

/** Pantalla de sala: solo pide lo que el servidor decide que debe verse
 *  (turno llamado + últimos 4) — nunca la cola pendiente. */
async function refrescarSala(){
  const suc = sucKiosco();
  const fijaArea = !demo && equipo && equipo.rol==='sala' && equipo.area;
  const area = fijaArea || ui.salaArea || 'tramites';
  try{
    const r = await api('/api/sucursales/'+suc+'/sala?area='+area);
    ui.salaLlamando = mapTurnoDesdeAPI(r.llamando);
    ui.salaUltimos = (r.ultimosLlamados||[]).map(mapTurnoDesdeAPI);
  }catch(e){ console.error('No se pudo refrescar la sala', e); }
}

/** Ventanilla/caja: un solo viaje al servidor para la ficha activa, la
 *  pausa vigente, las últimas 4 atendidas y si el área de pagos está
 *  saturada — más la cola de espera de este puesto en concreto. */
async function refrescarOperador(){
  const o = puestoActualOperador();
  if (!o.p){ ui.opDatos=null; return; }
  try{
    const [estado, cola, colaSuc] = await Promise.all([
      api('/api/sucursales/'+o.suc+'/puestos/'+o.pid+'/estado'),
      api('/api/sucursales/'+o.suc+'/cola/'+o.pid),
      api('/api/sucursales/'+o.suc+'/cola').catch(function(){ return null; })
    ]);
    const colaMapeada = cola.map(mapTurnoDesdeAPI);
    if (!ui.colaConocida) ui.colaConocida = {};
    const colaPrevia = ui.colaConocida[o.pid];
    if (colaPrevia!=null && colaMapeada.length>colaPrevia && E.config.avisoNuevoTurno!==false){
      const llegaron = colaMapeada.length-colaPrevia;
      if (E.config.tonoActivo!==false) reproducirTono('campanita', .45);
      avisarOperador(llegaron===1 ? 'Llegó un turno nuevo a su fila.' : 'Llegaron '+llegaron+' turnos nuevos a su fila.', 'nuevo', 4500);
    }
    ui.colaConocida[o.pid] = colaMapeada.length;
    ui.opDatos = {
      act: mapTurnoDesdeAPI(estado.activo),
      pausa: estado.pausa ? {causal:estado.pausa.causal, desde:estado.pausa.desde} : null,
      atendidos: (estado.atendidos||[]).map(mapTurnoDesdeAPI),
      pagosSaturados: !!estado.pagosSaturados,
      cola: colaMapeada,
      enEsperaSuc: colaSuc ? colaSuc.length : null
    };
  }catch(e){ console.error('No se pudo refrescar la ventanilla', e); }
}

let temporizadorCuenta=null;
let temporizadorEncuesta=null;
let splashTimer=null;
function reiniciarCuenta(){
  clearInterval(temporizadorCuenta);
  temporizadorCuenta = setInterval(function(){
    if (ui.paso!=='ticket'){ clearInterval(temporizadorCuenta); return; }
    ui.cuenta--;
    if (ui.cuenta<=0){ clearInterval(temporizadorCuenta); reiniciarKiosco(); pintar(); return; }
    // Solo se actualiza el número del botón, sin volver a dibujar toda la
    // pantalla — repintar cada segundo era lo que causaba el salto visual.
    const boton = document.getElementById('contador-kiosco');
    if (boton) boton.textContent = 'Continuar ('+ui.cuenta+')';
    else pintar();
  },1000);
}
function reiniciarKiosco(){
  clearInterval(temporizadorCuenta);
  ui.paso='bienvenida'; ui.tramiteId=null; ui.pref=false; ui.cedula=''; ui.ticket=null; ui.cuenta=SEG_AUTOREGRESO;
  ui.kioscoError=null;
  refrescarKiosco().then(pintar);
}

function puestoActualOperador(){
  const suc=(equipo&&equipo.sucursalId)||ui.opSuc||E.sucursales[0].id;
  const fijo = !demo && !!(equipo&&equipo.puestoId);
  const pid = fijo?equipo.puestoId:(ui.opPuesto||(puestosDe(suc)[0]&&puestosDe(suc)[0].id));
  return {suc:suc, pid:pid, p:puestoPorId(pid)};
}
/* ---------------------------------------------------------------------------
   AVISOS DE VENTANILLA — banda propia de la interfaz, nunca un alert() del
   navegador. Se usa tanto para mensajes puntuales ("no hay turnos") como
   para el aviso de que llegó un turno nuevo a la fila del puesto.
   ------------------------------------------------------------------------- */
let temporizadorAvisoOperador = null;
let avisoOperadorSeq = 0;
function avisarOperador(texto, tipo, duracionMs){
  const id = ++avisoOperadorSeq;
  ui.avisoOperador = {texto:texto, tipo:tipo||'info', id:id};
  clearTimeout(temporizadorAvisoOperador);
  temporizadorAvisoOperador = setTimeout(function(){
    if (ui.avisoOperador && ui.avisoOperador.id===id){ ui.avisoOperador=null; pintar(); }
  }, duracionMs||5000);
}

/* Protección contra doble clic: cada acción reconstruye la pantalla entera,
   así que un doble clic accidental (muy natural sin retroalimentación
   táctil) puede caer sobre un botón distinto que haya quedado en esa misma
   posición tras el repintado — se siente como que la pantalla "se pegó".
   Se ignora una repetición de la MISMA acción crítica de ventanilla si
   llega a menos de 450 ms de la anterior. */
let ultimaAccionCritica = { a: null, cuando: 0 };
const ACCIONES_CRITICAS_VENTANILLA = new Set([
  'llamar','iniciar','finalizar','finalizar-sig','ausente','retornar',
  'reanunciar','pausar','reanudar','llamar-folio','derivar','der-confirmar'
]);
async function accion(a, v, t, el){
  if (ACCIONES_CRITICAS_VENTANILLA.has(a)){
    const ahora = Date.now();
    if (ultimaAccionCritica.a===a && (ahora-ultimaAccionCritica.cuando)<450) return;
    ultimaAccionCritica = { a: a, cuando: ahora };
  }
  const o = puestoActualOperador();

  switch(a){
    /* --- registro --- */
    /* --- inicio de sesión --- */
    case 'login-correo': ui.loginCorreo=el.value; return;
    case 'login-clave': ui.loginClave=el.value; return;
    case 'login-entrar': {
      const correo = normalizarCorreo(ui.loginCorreo);
      const clave = ui.loginClave||'';
      if (!correo || !clave){ ui.loginError='Digite su correo y su contraseña.'; break; }
      ui.loginError=null;
      try{
        const r = await api('/api/auth/login', {method:'POST', body:{correo:correo, clave:clave}});
        if (r.primerIngreso){
          ui.pantalla='nueva-clave'; ui.claveCorreo=r.correo; ui.claveTemporalPrevia=clave;
          ui.claveNueva=''; ui.claveConfirma=''; ui.claveError=null; ui.loginError=null; ui.loginClave='';
        } else {
          sesion = {correo:r.correo, rol:r.rol, token:r.token}; JWT = r.token;
          guardarSesion(sesion); ui = {};
          await cargar();
          conectarSocket();
        }
      }catch(e){ ui.loginError = e.message||'No se pudo iniciar sesión.'; ui.loginClave=''; }
      break;
    }
    case 'clave-nueva': ui.claveNueva=el.value; return;
    case 'clave-confirma': ui.claveConfirma=el.value; return;
    case 'clave-guardar': {
      const n1 = ui.claveNueva||'', n2 = ui.claveConfirma||'';
      if (n1.length < 8){ ui.claveError='La contraseña debe tener al menos 8 caracteres.'; break; }
      if (n1 !== n2){ ui.claveError='Las contraseñas no coinciden.'; break; }
      try{
        const r = await api('/api/auth/definir-clave', {method:'POST', body:{
          correo: ui.claveCorreo, claveTemporal: ui.claveTemporalPrevia||'coopelesca', claveNueva:n1
        }});
        sesion = {correo:r.correo, rol:r.rol, token:r.token}; JWT = r.token;
        guardarSesion(sesion); ui = {};
        await cargar();
        conectarSocket();
      }catch(e){ ui.claveError = e.message||'No se pudo guardar la contraseña.'; }
      break;
    }
    case 'login-salir': ui={}; break;
    case 'cerrar-sesion': {
      desconectarSocket();
      sesion = null; JWT = null; guardarSesion(null);
      guardarEquipo(null); equipo=null; demo=false; vista=null; ui={};
      break;
    }

    case 'regrol': ui.regRol=v; break;
    case 'regsuc': ui.regSuc=el.value; ui.regPuesto=null; ui.regDestino=null; break;
    case 'regpuesto': ui.regPuesto=el.value; return;
    case 'regarea': ui.regArea=el.value; return;
    case 'regdestino': ui.regDestino=el.value; return;
    case 'registrar': {
      if (!ui.regRol) return;
      const suc = ui.regSuc||E.sucursales[0].id;
      const d = {rol:ui.regRol, sucursalId:suc, usuario:(sesion&&sesion.correo)||null};
      if (ui.regRol==='operador') d.puestoId = ui.regPuesto || (puestosDe(suc)[0]&&puestosDe(suc)[0].id);
      if (ui.regRol==='sala') d.area = ui.regArea || 'tramites';
      if (ui.regRol==='encuestas'){
        const puestosSuc = puestosDe(suc);
        const destino = ui.regDestino || ('puesto:'+((puestosSuc[0]&&puestosSuc[0].id)||''));
        const partes = destino.split(':');
        if (partes[0]==='puesto'){
          const pu = puestoPorId(partes[1]);
          d.puestoId = partes[1];
          d.plataforma = pu ? pu.nombre : 'Ventanilla';
        } else {
          d.puestoId = null;
          d.plataforma = partes.slice(1).join(':') || 'Canal remoto';
        }
      }
      guardarEquipo(d); vista=d.rol; demo=false;
      ui={};
      conectarSocket();
      await refrescarVistaActual();
      break;
    }
    case 'demo': demo=true; vista='kiosco'; ui={}; await refrescarVistaActual(); break;
    case 'vista': {
      vista=v; ui.paso = v==='kiosco' ? (ui.paso||'bienvenida') : ui.paso;
      await refrescarVistaActual();
      break;
    }
    case 'salir': {
      const publica = !demo && equipo && (equipo.rol==='kiosco'||equipo.rol==='sala'||equipo.rol==='encuestas');
      if (publica){ ui.pin=''; ui.pinError=false; ui.modal=modalPin(); }
      else { guardarEquipo(null); demo=false; vista=null; ui={}; }
      break;
    }
    case 'pedir-pin-opciones': ui.pin=''; ui.pinError=false; ui.modal=modalPin(); break;
    case 'pin-tecla': {
      if (v==='limpiar') ui.pin='';
      else if (v==='borrar') ui.pin=(ui.pin||'').slice(0,-1);
      else if ((ui.pin||'').length<6) ui.pin=(ui.pin||'')+v;
      ui.pinError=false;
      const correcto = E.config.pinSalida||'1234';
      if ((ui.pin||'').length===correcto.length){
        // PIN correcto: no sale directo — abre el menú de opciones (ampliar
        // pantalla / cambiar pantalla) sobre la misma pantalla pública, para
        // no dejar el sistema de fichas sin este PIN si solo quería ampliar
        // la pantalla.
        if (ui.pin===correcto){ ui.pin=''; ui.modal=null; ui.menuOpciones=true; }
        else { ui.pinError=true; ui.pin=''; ui.modal=modalPin();
               setTimeout(function(){ ui.pinError=false; ui.modal=modalPin(); pintar(); },1500); }
      }
      if (ui.modal) ui.modal = modalPin();
      break;
    }
    case 'salir-confirmado': {
      // Igual que 'salir' en pantallas no públicas: el PIN ya se verificó
      // para llegar hasta el menú de opciones, no hace falta pedirlo de nuevo.
      guardarEquipo(null); demo=false; vista=null; ui={};
      break;
    }
    case 'toggle-menu-opciones': ui.menuOpciones = !ui.menuOpciones; break;
    case 'pantalla-completa': {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function(){});
      else document.exitFullscreen().catch(function(){});
      ui.menuOpciones = false;
      break;
    }
    case 'cerrar-modal': ui.modal=null; break;

    /* --- kiosco --- */
    case 'splash-listo': clearTimeout(splashTimer); splashTimer=null; ui.splashListo=true; break;
    case 'k-inicio': ui.paso='tramite'; break;
    case 'k-paso': ui.paso=v; break;
    case 'k-reiniciar': reiniciarKiosco(); break;
    case 'k-tramite': ui.tramiteId=v; ui.pref = t==='1'; ui.tramiteOrigen=ui.paso; ui.paso='cedula'; ui.cedula=''; ui.kioscoError=null; break;
    case 'k-tecla': {
      const d=(ui.cedula||'').replace(/\D/g,'');
      if (v==='limpiar') ui.cedula='';
      else if (v==='borrar') ui.cedula=d.slice(0,-1);
      else if (d.length<9) ui.cedula=d+v;
      // Solo se actualizan el visor y el botón, sin volver a dibujar toda la

      const nuevo = (ui.cedula||'').replace(/\D/g,'');

    case 'k-emitir': await emitirFicha(v==='1'); return;

    /* --- sala / voz --- */

    /* --- encuestas de satisfacción --- */
    case 'enc-iniciar': {
      // Sin turno en atención la encuesta no arranca: la tableta queda en espera.
      const puestoEnc = equipo && equipo.puestoId;

      if (puestoEnc && !t2) return;
      // Resguardo: si el turno ya tiene una encuesta registrada en esta

      if (t2 && t2.id && ui.encRespondidos && ui.encRespondidos.has(t2.id)) return;

    case 'pf-desde': filtroPeriodo().desde=el.value; filtroPeriodo().preset='custom'; pintar(); return;
    case 'pf-hasta': filtroPeriodo().hasta=el.value; filtroPeriodo().preset='custom'; pintar(); return;
    case 'pf-sucursal': filtroPeriodo().sucursal=el.value; pintar(); return;
    case 'enc-vista': ui.encVista=v; break;
    case 'res-modo-tendencia': ui.resumenModoTendencia=v; break;
    case 'rep-modo-tendencia': ui.repModoTendencia=v; break;
    case 'enc-modo-tendencia': ui.encModoTendencia=v; break;
    case 'rep-csv': descargarCSVEncuestas(); return;
    case 'rep-imprimir': imprimirReporteEncuestas(); return;
    // Ventana emergente de detalle (clic en una barra o fila de Reportes) y
    // sus dos acciones de salida, acotadas a esa sola porción (t=tipo, v=clave
    // — mismo par que arma modalDetalleReporte).
    case 'rep-detalle': ui.modal = modalDetalleReporte(t, v); break;
    case 'rep-detalle-csv': descargarCSVEncuestas(filtroDetalle(t, v), etiquetaDetalle(t, v)); return;
    case 'rep-detalle-imprimir': imprimirReporteEncuestas(filtroDetalle(t, v), etiquetaDetalle(t, v)); return;
    case 'adm-logo': {
      try{ await api('/api/config', {method:'PATCH', body:{logo_url: el.value.trim()}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el logo.'); }
      break;
    }
    case 'adm-logo-reset': {
      try{ await api('/api/config', {method:'PATCH', body:{logo_url: ''}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo restaurar el logo.'); }
      break;
    }
    case 'adm-pin': {
      try{ await api('/api/config', {method:'PATCH', body:{pin_salida: el.value.replace(/\D/g,'').slice(0,6)}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el PIN.'); }
      break;
    }
    case 'adm-voz': {
      try{ await api('/api/config', {method:'PATCH', body:{voz_nombre: el.value}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar la voz.'); }
      break;
    }
    case 'adm-voz-perfil': {
      const perfil = PERFILES_VOZ.find(p=>p.id===el.value) || PERFILES_VOZ[0];
      try{ await api('/api/config', {method:'PATCH', body:{voz_velocidad:perfil.rate, voz_tono:perfil.pitch}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el perfil de voz.'); }
      break;
    }
    case 'adm-probar-perfil': {
      // Escucha el perfil indicado SIN necesidad de seleccionarlo primero,
      // igual que el botón "Escuchar" de cada tono. Prueba local, no toca el servidor.
      const perfil = PERFILES_VOZ.find(p=>p.id===v) || PERFILES_VOZ[0];
      anunciar({folio:'P-045', consecutivo:45, puesto:'Caja 1', preferencial:false,
        vozNombre:E.config.vozNombre, activa:true,
        _rate:perfil.rate, _pitch:perfil.pitch});
      return;
    }
    case 'adm-refrescar-voces': {
      // Local, no toca el servidor — busca entre las voces que el navegador ya
      // tiene o puede traer de red (ver refrescarVocesSistema), no crea voces
      // nuevas que el sistema operativo no ofrezca.
      ui.vocesActualizando = true; pintar();
      await refrescarVocesSistema();
      ui.vocesActualizando = false;
      break;
    }
    case 'adm-tono': {
      try{ await api('/api/config', {method:'PATCH', body:{tono_id: el.value}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el tono.'); }
      break;
    }
    case 'adm-probar-tono': reproducirTono(v); return;
    case 'adm-impresora': {
      try{ await api('/api/config', {method:'PATCH', body:{impresora_designada: el.value.trim()}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar la impresora designada.'); }
      break;
    }
    case 'adm-probar-impresion': {
      // Ticket de prueba con datos ficticios: sirve para confirmar, en el
      // equipo real, que --kiosk-printing manda directo a la impresora
      // correcta antes de dejarlo en producción — sin esperar a un turno real.
      imprimirTicket({
        folio:'PRUEBA', consecutivo:0, preferencial:false,
        tramiteNombre:'Página de prueba de impresión', horaCreado: ahora()
      }, (E.config.impresoraDesignada ? 'Impresora designada: '+E.config.impresoraDesignada : 'Prueba de impresión automática'));
      return;
    }
    case 'tono': {
      try{ await api('/api/config', {method:'PATCH', body:{tono_activo: !(E.config.tonoActivo!==false)}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo cambiar el tono.'); }
      break;
    }
    case 'adm-serv-url': {
      // El servidor nunca devuelve padron_url/padron_token en GET /config
      // (seguridad — ver src/routes/config.js), así que aquí también se
      // conserva un eco local: si no, el campo se vería vacío después de
      // guardado aunque el servidor sí lo tenga configurado.
      E.config.servidorUrl = el.value.trim();
      try{ await api('/api/config', {method:'PATCH', body:{padron_url: E.config.servidorUrl}}); }
      catch(e){ alert(e.message||'No se pudo guardar la dirección del servicio.'); }
      break;
    }
    case 'adm-serv-token': {
      E.config.servidorToken = el.value;
      try{ await api('/api/config', {method:'PATCH', body:{padron_token: E.config.servidorToken}}); }
      catch(e){ alert(e.message||'No se pudo guardar el token.'); }
      break;
    }
    case 'adm-probar-servidor': {
      // Se prueba a través del propio servidor (POST /config/probar-padron)
      // en vez de un fetch directo desde el navegador al padrón externo:
      // evita que la prueba falle por CORS aunque el servicio sí esté arriba,
      // y no expone el token del padrón al navegador de quien prueba.
      ui.servidorEstado='probando'; ui.servidorMensaje=null; pintar();
      try{
        await api('/api/config/probar-padron', {method:'POST'});
        ui.servidorEstado='ok'; ui.servidorMensaje='';
      }catch(e){
        ui.servidorEstado='error'; ui.servidorMensaje = e.message||'No se pudo alcanzar la dirección indicada.';
      }
      break;
    }
    case 'adm-powerbi-url': {
      E.config.powerbiUrl = el.value.trim();
      try{ await api('/api/config', {method:'PATCH', body:{powerbi_url: E.config.powerbiUrl}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar la dirección de Power BI.'); }
      break;
    }
    case 'adm-powerbi-token': {
      E.config.powerbiToken = el.value;
      try{ await api('/api/config', {method:'PATCH', body:{powerbi_token: E.config.powerbiToken}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el token de Power BI.'); }
      break;
    }
    case 'adm-powerbi-estado': {
      try{
        const r = await api('/api/config/powerbi/estado');
        ui.powerbiPendientes = r.pendientes; ui.powerbiUltimoEnvio = r.ultimoEnvio;
      }catch(e){ alert(e.message||'No se pudo consultar el estado de Power BI.'); }
      break;
    }
    case 'adm-powerbi-enviar': {
      // Igual que «Probar conexión» del padrón: se dispara a través del
      // propio servidor (no un fetch directo desde el navegador) para no
      // exponer el token de Power BI y para que el envío corra completo
      // aunque la persona cierre esta pantalla antes de que termine.
      ui.powerbiEnvioEstado='enviando'; ui.powerbiEnvioMensaje=null; pintar();
      try{
        const r = await api('/api/config/powerbi/enviar', {method:'POST'});
        ui.powerbiEnvioEstado='ok';
        ui.powerbiEnvioMensaje = r.enviados>0 ? ('Se enviaron '+r.enviados+' turnos.') : 'No había turnos pendientes de enviar.';
        try{
          const r2 = await api('/api/config/powerbi/estado');
          ui.powerbiPendientes = r2.pendientes; ui.powerbiUltimoEnvio = r2.ultimoEnvio;
        }catch(e){}
      }catch(e){
        ui.powerbiEnvioEstado='error'; ui.powerbiEnvioMensaje = e.message||'No se pudo enviar a Power BI.';
      }
      break;
    }
    case 'adm-salesforce-url': {
      E.config.salesforceUrl = el.value.trim();
      try{ await api('/api/config', {method:'PATCH', body:{salesforce_url: E.config.salesforceUrl}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar la dirección de Salesforce.'); }
      break;
    }
    case 'adm-salesforce-token': {
      E.config.salesforceToken = el.value;
      try{ await api('/api/config', {method:'PATCH', body:{salesforce_token: E.config.salesforceToken}}); await cargarCatalogo(); }
      catch(e){ alert(e.message||'No se pudo guardar el token de Salesforce.'); }
      break;
    }
    case 'adm-reiniciar': {
      if (!confirm('Esto solo borra fichas de DEMOSTRACIÓN en este navegador (Resumen/Reportes) — no toca los turnos reales del kiosco/ventanilla. ¿Continuar?')) return;
      mutar(function(s){ s.turnos=[]; s.contadores={}; s.pausas={}; s.pausasHistorial=[]; }); return;
    }
    case 'adm-reiniciar-contadores': {
      if (!confirm('Esto solo reinicia el contador de DEMOSTRACIÓN en este navegador — los folios reales del kiosco los numera el servidor y no se ven afectados. ¿Continuar?')) return;
      mutar(function(s){ s.contadores={}; }); return;
    }
    default: return;
  }
  pintar();
}

/* ---------------- eventos ---------------- */
app.addEventListener('click', function(ev){
  const cerrar = ev.target.closest('[data-cerrar]');
  const dentro = ev.target.closest('.modal');
  if (cerrar && !dentro){ ui.modal=null; pintar(); return; }
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const tag = el.tagName.toLowerCase();
  if (tag==='input'||tag==='select') return;   // se manejan por change
  accion(el.getAttribute('data-a'), el.getAttribute('data-v'), el.getAttribute('data-t'), el);
});
app.addEventListener('change', function(ev){
  const el = ev.target.closest('[data-a]');
  if (!el) return;
  const tag = el.tagName.toLowerCase();
  if (tag!=='input' && tag!=='select') return;
  if (el.type==='file'){
    // Los archivos no pasan por accion() como texto: se leen aparte y se
    // agregan directo a la lista de anuncios como vista previa local.
    manejarArchivoAnuncio(el);
    return;
  }
  accion(el.getAttribute('data-a'), el.getAttribute('data-v'), el.getAttribute('data-t'), el);
});
/* Estos campos se actualizan en cada tecla (no solo al salir del campo con
   'change'): así, si algo dispara un repintado mientras la persona está
   escribiendo —llegó un turno nuevo, otro puesto atendió una ficha, el
   respaldo de reconexión cada 6 s—, lo ya digitado no se pierde. La cédula
   manual en particular se estaba borrando sola a media escritura porque
   cualquiera de esos repintados reconstruía el modal desde el último valor
   confirmado por 'change' (o sea, ninguno todavía). */
app.addEventListener('input', function(ev){
  const attr = ev.target.getAttribute && ev.target.getAttribute('data-a');
  if (attr==='folio-manual'){
    const limpio = ev.target.value.replace(/\D/g,'');
    if (ev.target.value !== limpio) ev.target.value = limpio; // descarta letras al vuelo
    ui.folioManual = limpio;
  } else if (attr==='cedula-manual'){
    ui.cedulaManual = ev.target.value;
  } else if (attr==='voz-buscar'){
    // Filtra en vivo sin pasar por accion()/pintar(): un repintado completo
    // perdería el foco del campo a media escritura (ver filtrarVocesSelect).
    filtrarVocesSelect(ev.target, 'sel-voz');
  }
});

/* Pulsación larga sobre el logo (2 s) para salir de pantallas públicas */
let holdTimer=null, holdInicio=0;
function iniciarHold(ev){
  const zona = ev.target.closest('.logo-hold');
  if (!zona || zona.getAttribute('data-hold')!=='1') return;
  const barra = zona.querySelector('.prog');
  holdInicio = Date.now();
  clearInterval(holdTimer);
  holdTimer = setInterval(function(){
    const p = Math.min(1,(Date.now()-holdInicio)/2000);
    if (barra) barra.style.width = (p*100)+'%';
    if (p>=1){ clearInterval(holdTimer); if(barra) barra.style.width='0';
      accion('salir'); }
  },60);
}
function cancelarHold(){ clearInterval(holdTimer); const b=document.querySelector('.logo-hold .prog'); if(b) b.style.width='0'; }
app.addEventListener('mousedown', iniciarHold);
app.addEventListener('touchstart', iniciarHold, {passive:true});
['mouseup','mouseleave','touchend','touchcancel'].forEach(e=>app.addEventListener(e, cancelarHold));
app.addEventListener('contextmenu', function(ev){ if (ev.target.closest('.logo-hold')) ev.preventDefault(); });

/* Cronómetros de la ventanilla: se actualizan cada segundo SIN reconstruir
   la pantalla — solo se toca el texto de los tres relojes (espera,
   atención, pausa). Antes se llamaba a pintar() completo cada segundo, lo
   que reconstruía TODOS los botones de la pantalla 3600 veces por hora; si
   un clic caía justo en el instante en que el DOM se estaba reemplazando,
   el botón original ya no existía y el clic se perdía en silencio — la
   causa más probable de sentir que los botones "no responden" a veces.
   Ahora solo se actualizan tres números de texto, nunca se toca ningún
   botón, así que no hay ninguna ventana en la que un clic pueda perderse. */
function actualizarCronometrosVentanilla(){
  if (vista!=='operador' || ui.modal) return;
  const o = puestoActualOperador();
  if (!o.p) return;
  const datos = ui.opDatos || {};
  const pausa = datos.pausa;
  if (pausa){
    const elP = document.getElementById('crono-pausa');
    if (elP) elP.textContent = crono(segDesde(pausa.desde));
    return;
  }
  const act = datos.act;
  if (!act) return;
  const elEspera = document.getElementById('crono-espera');
  if (elEspera) elEspera.textContent = crono(segDesde(act.horaCreado, act.horaAtencion));
  const elAtencion = document.getElementById('crono-atencion');
  if (elAtencion && act.horaAtencion) elAtencion.textContent = crono(segDesde(act.horaAtencion));
}
setInterval(actualizarCronometrosVentanilla, 1000);

/* ---------------------------------------------------------------------------
   TOOLTIP DE GRÁFICAS — un solo elemento flotante reutilizado por todas las
   gráficas de Administración. Cualquier elemento con data-tip='<html>' (con
   la comilla exterior SIMPLE, para poder anidar comillas dobles adentro sin
   escapes) muestra ese HTML al pasar el cursor, siguiendo el mouse.
   ------------------------------------------------------------------------- */
let ttGrafEl = null, ttGrafSrc = null;
function ttGrafPosicionar(x, y){
  if (!ttGrafEl) return;
  const pad = 16, vw = window.innerWidth, vh = window.innerHeight;
  const w = ttGrafEl.offsetWidth, h = ttGrafEl.offsetHeight;
  let left = x+pad, top = y+pad;
  if (left+w > vw-8) left = x-w-pad;
  if (top+h > vh-8) top = y-h-pad;
  if (left<8) left=8; if (top<8) top=8;
  ttGrafEl.style.left = left+'px'; ttGrafEl.style.top = top+'px';
}
document.addEventListener('mousemove', function(ev){
  const el = ev.target.closest ? ev.target.closest('[data-tip]') : null;
  if (!el){ if (ttGrafEl){ ttGrafEl.style.display='none'; ttGrafSrc=null; } return; }
  if (!ttGrafEl){
    ttGrafEl = document.createElement('div');
    ttGrafEl.className = 'tt-graf';
    document.body.appendChild(ttGrafEl);
  }
  if (ttGrafSrc !== el){
    ttGrafEl.innerHTML = el.getAttribute('data-tip');
    ttGrafSrc = el;
  }
  ttGrafEl.style.display = 'block';
  ttGrafPosicionar(ev.clientX, ev.clientY);
});
document.addEventListener('mouseleave', function(){ if (ttGrafEl){ ttGrafEl.style.display='none'; ttGrafSrc=null; } });

/* Rotación del recuadro de anuncios (kiosco y pantalla de sala): cada 30 s,
   para poder poner más imágenes sin que pasen demasiado rápido.
   IMPORTANTE: actualiza SOLO el recuadro del anuncio (#panel-anuncio),
   nunca llama a pintar() completo — antes reconstruía la pantalla entera
   cada 30 s (folio, cronómetros, todo), lo cual además reiniciaba el video
   que estuviera reproduciéndose y podía interrumpir a quien estuviera
   escribiendo en algún campo en ese momento. */
setInterval(function(){
  const enSala = vista==='sala';
  const enKiosco = vista==='kiosco' && (ui.paso||'bienvenida')==='bienvenida';
  if (!enSala && !enKiosco) return;
  const pantalla = enKiosco ? 'kiosco' : 'sala';
  const n = anunciosDe(pantalla).length;
  if (n<2) return;
  ui.anuncioIndex = ((ui.anuncioIndex||0)+1) % n;
  const panel = document.getElementById('panel-anuncio');
  if (panel) panel.innerHTML = anuncioHTML(pantalla);
}, 30000);

/* Voces disponibles al cargar */
if (window.speechSynthesis){
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = function(){ if (vista==='admin') pintar(); };
}

/* Repinta el ícono de pantalla completa cuando el navegador termina la
   transición (entrar/salir es asíncrono, y también puede salir el usuario
   con Esc en vez del botón). */
document.addEventListener('fullscreenchange', function(){ if (sesion) pintar(); });

/* Respaldo del WebSocket: si por lo que sea la conexión se cae o el evento
   'cambio' no llega, cada pocos segundos se vuelve a pedir igual la
   información de la pantalla activa. */
setInterval(function(){
  if (sesion && (vista==='sala'||vista==='operador'||vista==='kiosco'||vista==='encuestas')) refrescarVistaActual();
}, 6000);

/* ---------------- arranque ---------------- */
(async function iniciar(){
  try{
    const s = sessionStorage.getItem(CLAVE_SESION);
    const d = s ? JSON.parse(s) : null;
    if (d && d.correo && d.token){ sesion = d; JWT = d.token; }
  }catch(e){}
  await cargar();
  if (!localStorage.getItem(CLAVE_ESTADO)) guardar();
  if (sesion && equipo) conectarSocket();
  pintar();
  const cargaInicial = document.getElementById('carga-inicial');
  if (cargaInicial){
    cargaInicial.style.opacity = '0';
    setTimeout(function(){ cargaInicial.remove(); }, 250);
  }
  if (sesion && (vista==='sala'||vista==='operador'||vista==='kiosco'||vista==='encuestas')) await refrescarVistaActual();
})();

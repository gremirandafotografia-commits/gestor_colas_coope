/** Tarjeta KPI grande con valor, subtítulo, acento de color y minigráfico de
 *  tendencia con área rellena (look de tablero, no solo una línea suelta).
 *  detalle (opcional) {tipo,clave}: si viene, toda la casilla se vuelve
 *  clicable y abre la ventana emergente de detalle con ESE subconjunto del
 *  período — misma acción "rep-detalle" que usan las barras y las filas. */
function kpiHTML(titulo, valor, sub, serie, color, detalle){
  color = color || 'var(--azul)';
  let spark = '';
  if (serie && serie.length>1){
    const max = Math.max.apply(null, serie.concat([1]));
    const w = 100, hh = 30;
    const pts = serie.map(function(v,i){
      const x = (i/(serie.length-1))*w;
      const y = hh - (v/max)*(hh-4) - 2;
      return {x:x, y:y};
    });
    const linea = pts.map(function(p){ return p.x.toFixed(1)+','+p.y.toFixed(1); }).join(' ');
    const area = 'M0,'+hh+' L'+linea.replace(/ /g,' L')+' L'+w+','+hh+' Z';
    const gid = 'spk'+Math.random().toString(36).slice(2,8);
    spark = '<svg viewBox="0 0 '+w+' '+hh+'" preserveAspectRatio="none" style="width:100%;height:32px;margin-top:8px">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+color+'" stop-opacity=".28"/>'+
        '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#'+gid+')"/>'+
      '<polyline points="'+linea+'" fill="none" stroke="'+color+'" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" opacity=".95"/></svg>';
  }
  const clickAttrs = detalle
    ? ' data-a="rep-detalle" data-t="'+detalle.tipo+'" data-v="'+esc(detalle.clave)+'" class="card-rep kpi-viva" style="padding:15px 17px;border-left:4px solid '+color+';cursor:pointer"'
    : ' class="card-rep" style="padding:15px 17px;border-left:4px solid '+color+'"';
  return '<div'+clickAttrs+'>'+
    '<div style="font-size:11px;color:var(--dim);font-weight:700;letter-spacing:.6px;text-transform:uppercase">'+esc(titulo)+'</div>'+
    '<div class="num-grande" style="font-size:29px;font-weight:800;color:'+color+';line-height:1.18;margin-top:4px;letter-spacing:.2px">'+esc(String(valor))+'</div>'+
    (sub?'<div style="font-size:11.5px;color:var(--dim);margin-top:2px">'+esc(sub)+'</div>':'')+
    spark+'</div>';
}

/** Construye el HTML de un tooltip de un período: fecha/etiqueta, total y,
 *  si hay desglose por trámite, cada línea con su color y su valor. */
function ttPeriodoHTML(titulo, total, totalEtiqueta, desglose, formatoTiempo){
  const fmt = function(v){ return formatoTiempo ? crono(v) : v; };
  let h = '<div class="tt-tit">'+esc(titulo)+'</div>';
  if (desglose && desglose.length){
    desglose.sort(function(a,b){ return b.valor-a.valor; }).forEach(function(d){
      if (!d.valor) return;
      h += '<div class="tt-fila"><span class="tt-sw" style="background:'+d.color+'"></span>'+
        '<span class="tt-etq">'+esc(d.etiqueta)+'</span><span class="tt-val">'+fmt(d.valor)+'</span></div>';
    });
    h += '<div class="tt-total"><span>'+esc(totalEtiqueta||'Total')+'</span><span>'+fmt(total)+'</span></div>';
  } else {
    h += '<div class="tt-total" style="border-top:none;padding-top:0;margin-top:0"><span>'+esc(totalEtiqueta||'Total')+'</span><span>'+fmt(total)+'</span></div>';
  }
  return h.replace(/'/g,'&#39;');
}

/** Regresión lineal simple (mínimos cuadrados) sobre una serie de valores
 *  igualmente espaciados — usada para dibujar la línea de tendencia que se
 *  superpone a los gráficos de barras y de líneas. Devuelve null si no hay
 *  suficientes puntos o son todos iguales en x (no debería pasar aquí). */
function tendenciaLineal(valores){
  const n = valores.length;
  if (n<2) return null;
  let sx=0, sy=0, sxy=0, sxx=0;
  valores.forEach(function(v,i){ sx+=i; sy+=v; sxy+=i*v; sxx+=i*i; });
  const denom = n*sxx - sx*sx;
  if (!denom) return null;
  const m = (n*sxy - sx*sy)/denom;
  const b = (sy - m*sx)/n;
  return {pendiente:m, base:b, predichos: valores.map(function(_,i){ return m*i+b; })};
}

/** Dibuja, sobre el mismo lienzo SVG que ya usa un gráfico de barras o de
 *  líneas, la recta de tendencia (regresión lineal) punteada — es lo que
 *  convierte un gráfico simple en un "combinado de barras/línea y tendencia".
 *  puntosY ya viene en % (0=arriba,100=abajo) en el mismo sistema de
 *  coordenadas que usa el gráfico que la invoca. */
function overlayTendenciaSVG(valores, puntosYFn, color){
  const t = tendenciaLineal(valores);
  if (!t) return '';
  const n = valores.length;
  const pts = t.predichos.map(function(v,i){
    const px = n>1 ? (i/(n-1))*100 : 50;
    return px.toFixed(2)+','+puntosYFn(v).toFixed(2);
  }).join(' ');
  const dif = t.predichos[n-1]-t.predichos[0];
  const flecha = dif>0.001 ? '▲' : (dif<-0.001 ? '▼' : '▬');
  return {
    svg:'<polyline points="'+pts+'" fill="none" stroke="'+(color||'#8A5B00')+'" stroke-width="1.8" stroke-dasharray="5 4" stroke-linecap="round" opacity=".85"/>',
    flecha: flecha, subiendo: dif>0.001, bajando: dif<-0.001
  };
}

/** Gráfico de barras por período; opcionalmente apiladas por tipo de trámite.
 *  Cada columna trae su propio tooltip con el detalle completo del período
 *  al pasar el cursor — así "cada día" se puede leer sin adivinar por el
 *  tamaño del segmento. */
function chartBarrasHTML(serie, campo, opts){
  opts = opts||{};
  const alto = opts.alto||210, apilar = !!opts.apilar;
  if (!serie.length) return '<div class="vacio">Sin datos en el período seleccionado.</div>';
  const vis = serie.slice(-31);
  const val = function(x){ return apilar ? x.fichas : (x[campo]||0); };
  const max = Math.max.apply(null, vis.map(val).concat([1]));
  const usados = {};
  if (apilar) vis.forEach(function(x){ Object.keys(x.porTramite||{}).forEach(function(k){ usados[k]=true; }); });
  const lista = Object.keys(usados);
  const ancho = vis.length<=6 ? 78 : (vis.length<=12 ? 52 : 34);
  const gradId = opts.gradiente || 'var(--grad-azul)';
  let h = '<div style="position:relative">'+
    '<div style="display:flex;align-items:flex-end;gap:5px;height:'+alto+'px;padding:8px 2px 30px;overflow-x:auto">';
  vis.forEach(function(x,i){
    const total = val(x);
    const hpx = total ? Math.max(3, Math.round((total/max)*(alto-56))) : 2;
    const rot = opts.formato==='tiempo' ? 'transform:rotate(-45deg);transform-origin:bottom left;white-space:nowrap;' : '';
    const desglose = apilar ? lista.map(function(k){
      const tr = E.tramites.find(function(y){ return y.id===k; });
      return {etiqueta:tr?tr.nombre:k, valor:(x.porTramite||{})[k]||0, color:colorTramite(k)};
    }) : null;
    const tip = ttPeriodoHTML(x.etiqueta, total, opts.etiquetaTotal||'Total', desglose, opts.formato==='tiempo');
    // Cuando el llamador pide detalle por período (opts.clickTipo), cada barra
    // queda clicable: abre la ventana emergente con el desglose de ESE día
    // (o mes/año, según la granularidad activa) — la clave es la misma que ya
    // trae cada punto de la serie (x.clave, armada en analizar()/claveGran()).
    const clickAttrs = (opts.clickTipo && x.clave!=null)
      ? ' data-a="rep-detalle" data-t="'+opts.clickTipo+'" data-v="'+esc(x.clave)+'"'
      : '';
    // El retraso escalonado (i*16ms) hace que las barras "entren" en cascada
    // de izquierda a derecha en vez de saltar todas de golpe.
    const demora = 'animation-delay:'+(i*16)+'ms';
    h += '<div data-tip=\''+tip+'\''+clickAttrs+' style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:24px;flex:1;height:100%;position:relative;cursor:'+(clickAttrs?'pointer':'default')+'">'+
      '<div style="font-size:9.5px;color:var(--dim);margin-bottom:3px;font-weight:800;'+rot+'">'+(total?(opts.formato==='tiempo'?crono(total):total):'')+'</div>';
    if (apilar && lista.length){
      h += '<div class="bar-viva" style="'+demora+';width:100%;max-width:'+ancho+'px;height:'+hpx+'px;border-radius:5px 5px 0 0;overflow:hidden;display:flex;flex-direction:column-reverse;box-shadow:0 2px 6px -2px rgba(15,45,70,.25)">'+
        lista.map(function(k){
          const v = (x.porTramite||{})[k]||0;
          if (!v) return '';
          return '<div style="height:'+Math.max(1,Math.round((v/total)*hpx))+'px;background:'+colorTramite(k)+';border-top:1px solid rgba(255,255,255,.35)"></div>';
        }).join('')+'</div>';
    } else {
      h += '<div class="bar-viva" style="'+demora+';width:100%;max-width:'+ancho+'px;height:'+hpx+'px;border-radius:5px 5px 0 0;background:'+gradId+';box-shadow:0 2px 6px -2px rgba(15,45,70,.25)"></div>';
    }
    h += '<div style="position:absolute;bottom:-24px;font-size:9.5px;color:var(--dim);font-weight:600;white-space:nowrap;transform:rotate(-35deg);transform-origin:top center">'+esc(x.etiqueta)+'</div></div>';
  });
  h += '</div>';
  // Combinado con tendencia: se superpone al mismo lienzo una recta de
  // regresión lineal punteada — el gráfico de barras "combinado con línea de
  // tendencia" que se pidió, sin tocar el resto de opciones existentes.
  let tendenciaTexto = '';
  if (opts.tendencia && vis.length>=2){
    const factor = (alto-56)/(alto-38);
    const yFn = function(v){ return 100 - (v/max)*100*factor; };
    const ov = overlayTendenciaSVG(vis.map(val), yFn, opts.colorTendencia||'#8A5B00');
    if (ov){
      h += '<div style="position:absolute;left:2px;right:2px;top:8px;bottom:30px;pointer-events:none">'+
        '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">'+ov.svg+'</svg></div>';
      tendenciaTexto = '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);margin-top:6px">'+
        '<span style="color:'+(opts.colorTendencia||'#8A5B00')+';font-weight:800">'+ov.flecha+'</span>'+
        '<span>Tendencia del período: '+(ov.subiendo?'en aumento':(ov.bajando?'en descenso':'estable'))+' (línea punteada).</span></div>';
    }
  }
  h += '</div>';
  if (apilar && lista.length) h += leyendaTramitesHTML(lista);
  if (tendenciaTexto) h += tendenciaTexto;
  return h;
}

function leyendaTramitesHTML(lista){
  return '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:12px;padding-top:10px;border-top:1px solid var(--gris)">'+
    lista.map(function(k){
      const tr = E.tramites.find(function(x){ return x.id===k; });
      return '<span style="display:flex;align-items:center;gap:6px;font-weight:600"><span style="width:10px;height:10px;border-radius:3px;background:'+colorTramite(k)+'"></span>'+esc(tr?tr.nombre:k)+'</span>';
    }).join('')+'</div>';
}

/** Línea de tendencia para promedios (espera, atención, satisfacción), con
 *  área degradada bajo la curva y un punto interactivo por período que
 *  muestra su valor exacto al pasar el cursor. */
function chartLineaHTML(serie, campo, opts){
  opts = opts||{};
  const alto = opts.alto||180, color = opts.color||'var(--azul)';
  const vis = serie.slice(-31).filter(function(x){ return x[campo]!=null; });
  if (vis.length<2) return '<div class="vacio">Se necesitan al menos dos períodos con datos para trazar la tendencia.</div>';
  const vals = vis.map(function(x){ return x[campo]; });
  const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  const span = (max-min)||1;
  const zona = alto-38;
  const yDe = function(v){ return 100 - ((v-min)/span)*88 - 6; };
  const pts = vis.map(function(x,i){
    const px = (i/(vis.length-1))*100;
    return {px:px, py:yDe(x[campo])};
  });
  const fmt = opts.formato==='tiempo' ? crono : function(v){ return (Math.round(v*10)/10); };
  const linea = pts.map(function(p){ return p.px.toFixed(2)+','+p.py.toFixed(2); }).join(' ');
  const area = 'M0,100 L'+linea.replace(/ /g,' L')+' L100,100 Z';
  const gid = 'lin'+Math.random().toString(36).slice(2,8);
  // Combinado con tendencia: además de la línea real se puede superponer la
  // recta de regresión lineal (punteada) — "gráfico combinado de líneas y de
  // tendencias" que se pidió.
  let svgTendencia = '', notaTendencia = '';
  if (opts.tendencia){
    const ov = overlayTendenciaSVG(vals, yDe, opts.colorTendencia||'#8A5B00');
    if (ov){
      svgTendencia = ov.svg;
      notaTendencia = '<div style="display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--dim);margin-top:4px">'+
        '<span style="color:'+(opts.colorTendencia||'#8A5B00')+';font-weight:800">'+ov.flecha+'</span>'+
        '<span>Tendencia del período: '+(ov.subiendo?'en aumento':(ov.bajando?'en descenso':'estable'))+' (línea punteada).</span></div>';
    }
  }
  let h = '<div style="position:relative;padding-bottom:26px">'+
    '<div style="position:relative;height:'+zona+'px">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/>'+
        '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
      '</linearGradient></defs>'+
      '<path d="'+area+'" fill="url(#'+gid+')"/>'+
      '<polyline class="linea-viva" points="'+linea+'" fill="none" stroke="'+color+'" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-dasharray:1600;stroke-dashoffset:1600"/>'+
      svgTendencia+
    '</svg>'+
    pts.map(function(p,i){
      const tip = ttPeriodoHTML(vis[i].etiqueta, vis[i][campo], opts.etiquetaTotal||'Valor', null, opts.formato==='tiempo');
      // Igual que en las barras: si el llamador pide detalle por período, cada
      // punto abre la misma ventana emergente de desglose.
      const clickAttrs = (opts.clickTipo && vis[i].clave!=null)
        ? ' data-a="rep-detalle" data-t="'+opts.clickTipo+'" data-v="'+esc(vis[i].clave)+'"'
        : '';
      return '<div data-tip=\''+tip+'\''+clickAttrs+' style="position:absolute;left:'+p.px+'%;top:'+p.py+'%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;cursor:'+(clickAttrs?'pointer':'default')+'"></div>'+
        '<div class="punto-viva" style="animation-delay:'+(i*22)+'ms;position:absolute;left:'+p.px+'%;top:'+p.py+'%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:'+color+';border:1.6px solid #fff;box-shadow:0 1px 3px rgba(15,45,70,.3);pointer-events:none"></div>';
    }).join('')+
    '</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:6px;font-weight:600">'+
      '<span>'+esc(vis[0].etiqueta)+' · '+fmt(vis[0][campo])+'</span>'+
      '<span>'+esc(vis[vis.length-1].etiqueta)+' · '+fmt(vis[vis.length-1][campo])+'</span></div>'+
    '<div style="font-size:10.5px;color:var(--dim);margin-top:2px">Mínimo '+fmt(min)+' · Máximo '+fmt(max)+'</div>'+
    notaTendencia+
  '</div>';
  return h;
}

/** Dona de distribución (satisfacción, mezcla de trámites), con separación
 *  fina entre segmentos y tooltip individual por porción. */
function chartDonaHTML(items, opts){
  opts = opts||{};
  const total = items.reduce(function(a,x){ return a+x.valor; },0);
  if (!total) return '<div class="vacio">Sin datos en el período seleccionado.</div>';
  const R = 42, r0 = 25, cx = 50, cy = 50;
  let ang = -Math.PI/2, paths = '';
  items.forEach(function(it){
    if (!it.valor) return;
    const frac = it.valor/total, fin = ang + frac*Math.PI*2;
    const grande = frac > .5 ? 1 : 0;
    const pct = (frac*100).toFixed(1);
    const val = opts.formato==='tiempo' ? crono(it.valor) : it.valor;
    const tip = ('<div class="tt-fila"><span class="tt-sw" style="background:'+it.color+'"></span>'+
      '<span class="tt-etq">'+esc(it.etiqueta)+'</span><span class="tt-val">'+val+' · '+pct+'%</span></div>').replace(/'/g,'&#39;');
    // Igual que en las barras: si el llamador incluyó it.detalleTipo (y
    // it.detalleClave), el gajo y su fila de leyenda abren la ventana
    // emergente con el desglose de ESA porción — opt-in por elemento.
    const clickAttrs = (it.detalleTipo && it.detalleClave!=null)
      ? ' data-a="rep-detalle" data-t="'+it.detalleTipo+'" data-v="'+esc(it.detalleClave)+'" style="cursor:pointer"'
      : ' style="cursor:default"';
    const x1 = cx+R*Math.cos(ang), y1 = cy+R*Math.sin(ang);
    const x2 = cx+R*Math.cos(fin), y2 = cy+R*Math.sin(fin);
    const x3 = cx+r0*Math.cos(fin), y3 = cy+r0*Math.sin(fin);
    const x4 = cx+r0*Math.cos(ang), y4 = cy+r0*Math.sin(ang);
    if (frac >= .999){
      paths += '<circle data-tip=\''+tip+'\''+clickAttrs+' cx="'+cx+'" cy="'+cy+'" r="'+((R+r0)/2)+'" fill="none" stroke="'+it.color+'" stroke-width="'+(R-r0)+'"/>';
    } else {
      paths += '<path data-tip=\''+tip+'\''+clickAttrs+' d="M'+x1.toFixed(2)+' '+y1.toFixed(2)+' A'+R+' '+R+' 0 '+grande+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+
        ' L'+x3.toFixed(2)+' '+y3.toFixed(2)+' A'+r0+' '+r0+' 0 '+grande+' 0 '+x4.toFixed(2)+' '+y4.toFixed(2)+' Z" fill="'+it.color+'" stroke="#fff" stroke-width="1.4"/>';
    }
    ang = fin;
  });
  return '<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">'+
    '<div class="dona-viva" style="position:relative;width:136px;height:136px;flex:none;filter:drop-shadow(0 3px 8px rgba(15,45,70,.16))">'+
      '<svg viewBox="0 0 100 100" style="width:136px;height:136px">'+paths+'</svg>'+
      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none">'+
        '<div class="num-grande" style="font-size:22px;font-weight:800;color:var(--texto)">'+(opts.centro||total)+'</div>'+
        '<div style="font-size:10px;color:var(--dim);font-weight:600">'+esc(opts.centroSub||'total')+'</div></div>'+
    '</div>'+
    '<div style="flex:1;min-width:150px">'+items.map(function(it){
      const pct = total ? (it.valor/total*100) : 0;
      const txt = opts.formato==='tiempo' ? crono(it.valor) : it.valor;
      const clickAttrs = (it.detalleTipo && it.detalleClave!=null)
        ? ' data-a="rep-detalle" data-t="'+it.detalleTipo+'" data-v="'+esc(it.detalleClave)+'"'
        : '';
      return '<div'+clickAttrs+' style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0'+(clickAttrs?';cursor:pointer':'')+'">'+
        '<span style="width:10px;height:10px;border-radius:3px;background:'+it.color+';flex:none"></span>'+
        '<span style="flex:1;color:var(--texto)">'+esc(it.etiqueta)+'</span>'+
        '<b class="num-grande" style="min-width:34px;text-align:right">'+txt+'</b><span style="color:var(--dim);width:50px;text-align:right;font-weight:600">'+pct.toFixed(1)+'%</span></div>';
    }).join('')+'</div></div>';
}

/** Barras horizontales con valor y porcentaje, en degradado. */
function chartBarrasHorizHTML(items, opts){
  opts = opts||{};
  if (!items.length) return '<div class="vacio">Sin datos en el período seleccionado.</div>';
  // opts.max: escala fija (p.ej. 5 para calificaciones de 1 a 5) en vez del
  // máximo real de los datos — así una calificación de 4.2 no llena casi
  // toda la barra como si fuera el mejor puntaje posible.
  const max = opts.max || Math.max.apply(null, items.map(function(x){ return x.valor; }).concat([1]));
  return items.map(function(it,i){
    const pct = (it.valor/max)*100;
    // Igual que en chartBarrasHTML: si el llamador incluyó it.detalleTipo (y
    // it.detalleClave), la fila abre la ventana emergente con el desglose de
    // ESE puesto/usuario — opt-in por elemento para no afectar otras barras
    // horizontales del sistema que no pasan estos campos.
    const clickAttrs = (it.detalleTipo && it.detalleClave!=null)
      ? ' data-a="rep-detalle" data-t="'+it.detalleTipo+'" data-v="'+esc(it.detalleClave)+'"'
      : '';
    return '<div'+clickAttrs+' style="margin-bottom:11px;'+(clickAttrs?'cursor:pointer':'')+'">'+
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px">'+
        '<span style="display:flex;align-items:center;gap:7px;color:var(--texto)">'+
          (it.color?'<span style="width:9px;height:9px;border-radius:3px;background:'+it.color+'"></span>':'')+esc(it.etiqueta)+'</span>'+
        '<b class="num-grande" style="color:'+(it.color||'var(--azul)')+'">'+esc(String(it.texto!=null?it.texto:it.valor))+'</b></div>'+
      '<div style="height:10px;background:var(--gris);border-radius:6px;overflow:hidden">'+
        '<div class="bar-viva-h" style="animation-delay:'+(i*30)+'ms;width:'+pct.toFixed(1)+'%;height:100%;background:'+(it.color||'var(--azul)')+';border-radius:6px;opacity:.92"></div></div></div>';
  }).join('');
}

/** Perfil horario: barras finas de 24 horas, para demanda y tiempos muertos,
 *  con tooltip propio (ya no depende del title nativo del navegador). */
function chartHorarioHTML(datos, opts){
  opts = opts||{};
  const max = Math.max.apply(null, datos.concat([1]));
  const desde = opts.desde!=null?opts.desde:6, hasta = opts.hasta!=null?opts.hasta:20;
  const gradId = opts.gradiente || 'var(--grad-cielo)';
  let h = '<div style="display:flex;align-items:flex-end;gap:3px;height:110px;padding-bottom:18px;position:relative">';
  for (let i=desde;i<=hasta;i++){
    const v = datos[i]||0;
    const hpx = v ? Math.max(2, Math.round((v/max)*80)) : 1;
    const txt = opts.formato==='tiempo' ? crono(v) : v;
    const tip = ttPeriodoHTML(i+':00 — '+(i+1)+':00', v, opts.etiquetaTotal||'Total', null, opts.formato==='tiempo');
    h += '<div data-tip=\''+tip+'\' style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:default">'+
      '<div class="bar-viva" style="animation-delay:'+((i-desde)*14)+'ms;width:100%;max-width:24px;height:'+hpx+'px;background:'+(opts.color||gradId)+';border-radius:4px 4px 0 0"></div>'+
      '<div style="position:absolute;bottom:-16px;font-size:9.5px;color:var(--dim);font-weight:600">'+i+'</div></div>';
  }
  h += '</div><div style="font-size:10.5px;color:var(--dim);text-align:center;font-weight:600">Hora del día</div>';
  return h;
}

/** Encabezado de sección para los tableros de Administración: ícono en

/** Etiqueta de cumplimiento con semáforo. */
function chipCumplimiento(pct){
  if (pct==null) return '<span style="color:var(--dim)">—</span>';
  const color = pct>=90 ? 'var(--verde-osc)' : (pct>=75 ? 'var(--naranja)' : 'var(--rojo)');
  return '<span class="num-grande" style="color:'+color+';font-weight:800">'+pct.toFixed(1)+'%</span>';
}


/** Gráfico combinado: barras apiladas de fichas atendidas por tipo de trámite,
 *  con la línea de encuestas recibidas superpuesta en la misma ventana. */
function chartComboEncuestasHTML(serie, opts){
  opts = opts||{};
  const alto = opts.alto||230;
  if (!serie.length) return '<div class="vacio">Sin datos en el período seleccionado.</div>';
  const vis = serie.slice(-31);
  const maxF = Math.max.apply(null, vis.map(function(x){ return x.fichas; }).concat([1]));
  const maxE = Math.max.apply(null, vis.map(function(x){ return x.encuestas; }).concat([1]));
  const usados = {};
  vis.forEach(function(x){ Object.keys(x.porTramite||{}).forEach(function(k){ usados[k]=true; }); });
  const lista = Object.keys(usados);
  const zona = alto-56;
  const ancho = vis.length<=6 ? 78 : (vis.length<=12 ? 52 : 34);

  let h = '<div style="position:relative">'+
    '<div style="display:flex;align-items:flex-end;gap:5px;height:'+alto+'px;padding:8px 2px 30px;position:relative">';
  vis.forEach(function(x,i){
    const hpx = x.fichas ? Math.max(3, Math.round((x.fichas/maxF)*zona)) : 2;
    const desglose = lista.map(function(k){
      const tr = E.tramites.find(function(y){ return y.id===k; });
      return {etiqueta:tr?tr.nombre:k, valor:(x.porTramite||{})[k]||0, color:colorTramite(k)};
    });
    const tipBarra = ttPeriodoHTML(x.etiqueta, x.fichas, 'Fichas atendidas', desglose, false);
    // Igual que en chartBarrasHTML: si el llamador pide detalle por período
    // (opts.clickTipo), la barra abre la ventana emergente con ese desglose.
    const clickAttrs = (opts.clickTipo && x.clave!=null)
      ? ' data-a="rep-detalle" data-t="'+opts.clickTipo+'" data-v="'+esc(x.clave)+'"'
      : '';
    h += '<div data-tip=\''+tipBarra+'\''+clickAttrs+' style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:24px;flex:1;height:100%;position:relative;cursor:'+(clickAttrs?'pointer':'default')+'">'+
      '<div style="font-size:10px;color:var(--dim);margin-bottom:3px;font-weight:800">'+(x.fichas||'')+'</div>'+
      '<div class="bar-viva" style="animation-delay:'+(i*16)+'ms;width:100%;max-width:'+ancho+'px;height:'+hpx+'px;border-radius:5px 5px 0 0;overflow:hidden;display:flex;flex-direction:column-reverse;box-shadow:0 2px 6px -2px rgba(15,45,70,.25)">'+
        lista.map(function(k){
          const v = (x.porTramite||{})[k]||0;
          if (!v) return '';
          return '<div style="height:'+Math.max(1,Math.round((v/x.fichas)*hpx))+'px;background:'+colorTramite(k)+';border-top:1px solid rgba(255,255,255,.35)"></div>';
        }).join('')+
      '</div>'+
      '<div style="position:absolute;bottom:-24px;font-size:9.5px;color:var(--dim);font-weight:600;white-space:nowrap;transform:rotate(-35deg);transform-origin:top center">'+esc(x.etiqueta)+'</div>'+
    '</div>';
  });
  h += '</div>';

  /* Línea de encuestas superpuesta, con su propia escala. */
  const pts = vis.map(function(x,i){
    const px = vis.length>1 ? (i/(vis.length-1))*100 : 50;
    const py = 100 - (x.encuestas/maxE)*88 - 6;
    return px.toFixed(2)+','+py.toFixed(2);
  });
  /* La línea comparte la misma base que las barras (30px de eje inferior), para
     que ambos lenguajes visuales se lean sobre el mismo suelo. */
  /* El SVG se estira horizontalmente (preserveAspectRatio="none"), así que solo
     lleva la línea: los puntos van como marcadores HTML para que no se
     deformen en elipses al escalar. */
  h += '<div style="position:absolute;left:2px;right:2px;bottom:30px;height:'+zona+'px;pointer-events:none">'+
    '<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:100%;overflow:visible">'+
      '<polyline class="linea-viva" points="'+pts.join(' ')+'" fill="none" stroke="var(--verde-osc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke" style="stroke-dasharray:1600;stroke-dashoffset:1600;animation-delay:.15s"/>'+
    '</svg>'+
    pts.map(function(p, i){
      const cc = p.split(',');
      const tipPunto = ttPeriodoHTML(vis[i].etiqueta, vis[i].encuestas, 'Encuestas recibidas', null, false);
      return '<div data-tip=\''+tipPunto+'\' style="position:absolute;left:'+cc[0]+'%;top:'+cc[1]+'%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;cursor:default;pointer-events:auto"></div>'+
        '<div class="punto-viva" style="animation-delay:'+(i*22+150)+'ms;position:absolute;left:'+cc[0]+'%;top:'+cc[1]+'%;'+
        'width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--verde-osc);border:1.5px solid #fff;box-sizing:border-box;box-shadow:0 1px 3px rgba(15,45,70,.3);pointer-events:none"></div>';
    }).join('')+
  '</div></div>';

  h += '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:12px;align-items:center">'+
    lista.map(function(k){
      const tr = E.tramites.find(function(x){ return x.id===k; });
      return '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:'+colorTramite(k)+'"></span>'+esc(tr?tr.nombre:k)+'</span>';
    }).join('')+
    '<span style="display:flex;align-items:center;gap:5px;margin-left:auto"><span style="width:16px;height:3px;border-radius:2px;background:var(--verde-osc)"></span>Encuestas recibidas (máx. '+maxE+')</span>'+
  '</div>';
  return h;
}

  }

  /* ============================== ENCUESTAS ============================== */
  if (tabAct==='encuestas'){
    const cfgEnc = c.encuestas||{preguntas:[],plataformas:[]};
    const A = analizar();
    const serie = A.serie;
    const sf = function(campo){ return serie.map(function(x){ return x[campo]||0; }); };
    const cobertura = A.atendidas ? (A.encuestas.length/A.atendidas*100) : null;

    h += barraFiltroHTML();

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:16px">'+
      kpiHTML('Encuestas recibidas', A.encuestas.length, A.totalRespuestas+' respuestas en total', sf('encuestas'), 'var(--verde-osc)', {tipo:'kpi',clave:'conEncuesta'})+
      kpiHTML('Satisfacción promedio', A.totalRespuestas?(Math.round(A.satPromedio*100)/100)+' / 5':'—',
              'Sobre '+A.totalRespuestas+' respuestas', sf('satProm'), 'var(--azul)', {tipo:'kpi',clave:'conEncuesta'})+
      kpiHTML('Cobertura', cobertura!=null?cobertura.toFixed(1)+'%':'—',
              'De '+A.atendidas+' fichas atendidas', null,
              cobertura==null?'var(--dim)':(cobertura>=60?'var(--verde-osc)':(cobertura>=30?'var(--naranja)':'var(--rojo)')))+
      kpiHTML('Respuestas positivas', (A.porSensacion[5]||0)+(A.porSensacion[4]||0),
              A.totalRespuestas?(((A.porSensacion[5]+A.porSensacion[4])/A.totalRespuestas*100).toFixed(1)+'% del total'):'—',
              null, 'var(--verde)', {tipo:'sensacion',clave:'4,5'})+
      kpiHTML('Respuestas negativas', (A.porSensacion[1]||0)+(A.porSensacion[2]||0),
              A.totalRespuestas?(((A.porSensacion[1]+A.porSensacion[2])/A.totalRespuestas*100).toFixed(1)+'% del total'):'—',
              null, 'var(--rojo)', {tipo:'sensacion',clave:'1,2'})+
      kpiHTML('Sin encuesta', A.sinEncuesta.length, 'Atenciones sin calificar', null, 'var(--dim)', {tipo:'kpi',clave:'sinEncuesta'})+
      '</div>';

    /* --- Encuestas y trámites en la misma ventana del gráfico --- */
    const modoEnc = ui.encVista || 'volumen';
    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:2px">'+
      tituloSeccionHTML('carita','Encuestas por '+(A.gran==='anio'?'año':(A.gran==='mes'?'mes':'día')),'var(--verde-osc)')+
      '<div style="display:flex;gap:4px">'+
        [['volumen','Volumen y trámite'],['satisfaccion','Satisfacción']].map(function(x){
          const act = modoEnc===x[0];
          return '<button class="btn" data-a="enc-vista" data-v="'+x[0]+'" style="padding:5px 12px;font-size:11.5px;background:'+
            (act?'var(--azul)':'var(--gris)')+';color:'+(act?'#fff':'var(--dim)')+'">'+x[1]+'</button>';
        }).join('')+
      '</div></div>';
    if (modoEnc==='satisfaccion'){
      h += '<p style="font-size:11.5px;color:var(--dim);margin:0 0 6px">Satisfacción promedio de las respuestas recibidas en cada período. Clic en un punto para ver el detalle.</p>'+
        chartLineaHTML(serie, 'satProm', {color:'var(--verde-osc)', alto:210, tendencia:true, clickTipo:'periodo'});
    } else {
      h += '<p style="font-size:11.5px;color:var(--dim);margin:0 0 6px">La barra muestra las fichas atendidas divididas por tipo de trámite; la línea marca cuántas encuestas se recibieron en ese mismo período. Clic en una barra para ver el detalle.</p>'+
        chartComboEncuestasHTML(serie, {alto:230, clickTipo:'periodo'});
    }
    h += '</div>';

    /* --- Distribución y por pregunta --- */
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:16px">';
    const sens = [5,4,3,2,1].map(function(v){
      return {etiqueta:SATISFACCION[v].etiqueta, valor:A.porSensacion[v]||0, color:SATISFACCION[v].color, detalleTipo:'sensacion', detalleClave:v};
    });
    h += '<div class="card-rep" style="padding:18px">'+tituloSeccionHTML('carita','Tipo de respuesta recibida','var(--verde-osc)')+
      '<p style="font-size:10.5px;color:var(--dim);margin:-6px 0 8px">Clic en una calificación para ver quién la dejó.</p>'+
      chartDonaHTML(sens, {centro:A.totalRespuestas?(Math.round(A.satPromedio*10)/10):'—', centroSub:'de 5'})+'</div>';

    h += '<div class="card-rep" style="padding:18px">'+tituloSeccionHTML('rejilla','Respuestas por pregunta','var(--azul)');
    const preg = Object.keys(A.porPregunta);
    if (preg.length){
      preg.forEach(function(k){
        const q = A.porPregunta[k];
        h += '<div style="margin-bottom:14px"><div style="font-size:12.5px;font-weight:600;margin-bottom:5px">'+esc(k)+
          ' <span style="color:var(--dim);font-weight:400">— '+q.n+' resp., promedio '+(q.suma/q.n).toFixed(2)+'</span></div>'+
          '<div style="display:flex;gap:3px;height:24px;border-radius:5px;overflow:hidden">';
        [5,4,3,2,1].forEach(function(v){
          const pct = q.n ? (q.dist[v]/q.n*100) : 0;
          const tip = ('<div class="tt-fila"><span class="tt-sw" style="background:'+SATISFACCION[v].color+'"></span><span class="tt-etq">'+SATISFACCION[v].etiqueta+'</span><span class="tt-val">'+q.dist[v]+' · '+pct.toFixed(1)+'%</span></div>').replace(/'/g,'&#39;');
          if (pct>0) h += '<div data-tip=\''+tip+'\' style="width:'+pct.toFixed(1)+'%;background:'+SATISFACCION[v].color+
            ';display:flex;align-items:center;justify-content:center;color:#233241;font-size:11px;font-weight:700;cursor:default">'+(pct>=9?q.dist[v]:'')+'</div>';
        });
        h += '</div></div>';
      });
      h += '<div style="display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--dim)">'+
        [5,4,3,2,1].map(function(v){ return '<span style="display:flex;align-items:center;gap:4px"><span style="width:9px;height:9px;border-radius:2px;background:'+SATISFACCION[v].color+'"></span>'+SATISFACCION[v].etiqueta+'</span>'; }).join('')+'</div>';
    } else h += '<div class="vacio">Sin respuestas en el período seleccionado.</div>';
    h += '</div></div>';

    /* --- Satisfacción cruzada por tipo de trámite --- */
    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      tituloSeccionHTML('rejilla','Satisfacción según el tipo de trámite realizado','var(--morado)')+
      '<p style="font-size:12px;color:var(--dim);margin:0 0 12px">Permite ver si la insatisfacción se concentra en un trámite en particular.</p>';
    const clavesSat = Object.keys(A.satPorTramite).sort(function(a,b){ return A.satPorTramite[b].n - A.satPorTramite[a].n; });
    if (clavesSat.length){
      h += '<div style="overflow-x:auto"><div style="min-width:620px">'+
        '<div style="display:grid;grid-template-columns:1.3fr 90px 100px 1.5fr;font-size:11.5px;color:var(--dim);font-weight:700;padding:6px 2px;border-bottom:1px solid var(--borde)">'+
        '<div>Trámite</div><div>Respuestas</div><div>Promedio</div><div>Distribución</div></div>';
      clavesSat.forEach(function(k){

        const tr = E.tramites.find(function(x){ return x.id===k; });

        h += '<div style="display:grid;grid-template-columns:1.3fr 90px 100px 1.5fr;font-size:12.5px;padding:8px 2px;border-bottom:1px solid var(--gris);align-items:center">'+
          '<div style="display:flex;align-items:center;gap:7px"><span style="width:9px;height:9px;border-radius:2px;background:'+colorTramite(k)+';flex:none"></span>'+esc(tr?tr.nombre:k)+'</div>'+
          '<div>'+q.n+'</div>'+
          '<div style="font-weight:700;color:'+(SATISFACCION[Math.round(pr)]||SATISFACCION[3]).color+'">'+pr.toFixed(2)+' / 5</div>'+
          '<div style="display:flex;gap:2px;height:18px;border-radius:4px;overflow:hidden">'+
            [5,4,3,2,1].map(function(v){
              const pct = q.n ? (q.dist[v]/q.n*100) : 0;
              const tip = ('<div class="tt-fila"><span class="tt-sw" style="background:'+SATISFACCION[v].color+'"></span><span class="tt-etq">'+SATISFACCION[v].etiqueta+'</span><span class="tt-val">'+q.dist[v]+' · '+pct.toFixed(1)+'%</span></div>').replace(/'/g,'&#39;');
              return pct>0 ? '<div data-tip=\''+tip+'\' style="width:'+pct.toFixed(1)+'%;background:'+SATISFACCION[v].color+';cursor:default"></div>' : '';
            }).join('')+
          '</div></div>';
      });
      h += '</div></div>';
    } else h += '<div class="vacio">Sin respuestas asociadas a un trámite en el período.</div>';
    h += '</div>';

    /* --- Satisfacción por puesto --- */
    const puestosSat = Object.keys(A.porPuesto).map(function(k){ return A.porPuesto[k]; })
      .filter(function(g){ return g.sat.length; })
      .sort(function(a,b){
        const pa = a.sat.reduce(function(x,y){return x+y;},0)/a.sat.length;
        const pb = b.sat.reduce(function(x,y){return x+y;},0)/b.sat.length;
        return pb-pa;
      });
    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      tituloSeccionHTML('user','Calificación por puesto de atención','var(--azul)');
    if (puestosSat.length){
      h += chartBarrasHorizHTML(puestosSat.map(function(g){
        const pr = g.sat.reduce(function(x,y){return x+y;},0)/g.sat.length;

                color:(SATISFACCION[Math.round(pr)]||SATISFACCION[3]).color};
      }));
    } else h += '<div class="vacio">Sin encuestas asociadas a un puesto en el período.</div>';

    /* --- Encuestas con cédula, para seguimiento --- */
    const conCedula = A.encuestas.filter(function(e){ return !!e.cedula; })

    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      tituloSeccionHTML('user','Encuestas con cédula registrada','var(--dim)')+
      '<p style="font-size:12px;color:var(--dim);margin:0 0 12px;line-height:1.5">Asociados que dejaron su cédula al ser atendidos, para poder contactarles y dar seguimiento o buscar puntos de mejora en el servicio.</p>';
    if (conCedula.length){
      h += '<div style="max-height:360px;overflow:auto"><div style="min-width:640px">'+
        '<div style="display:grid;grid-template-columns:110px 90px 1fr 150px 110px;font-size:11.5px;color:var(--dim);font-weight:700;padding:5px 2px;border-bottom:1px solid var(--borde)">'+
        '<div>Cédula</div><div>Folio</div><div>Plataforma</div><div>Fecha</div><div>Promedio</div></div>'+
        conCedula.map(function(e){
          const pr = e.respuestas&&e.respuestas.length ? (e.respuestas.reduce(function(a,x){return a+x.valor;},0)/e.respuestas.length) : null;
          const color = pr!=null ? (SATISFACCION[Math.round(pr)]||SATISFACCION[3]).color : 'var(--dim)';
          return '<div style="display:grid;grid-template-columns:110px 90px 1fr 150px 110px;font-size:12.5px;padding:7px 2px;border-bottom:1px solid var(--gris);align-items:center">'+
            '<b style="font-family:monospace">'+cedFmt(e.cedula)+'</b>'+
            '<div style="color:var(--azul)">'+esc(e.turnoFolio||'—')+'</div>'+
            '<div>'+esc(e.plataforma||'—')+'</div>'+
            '<div style="color:var(--dim)">'+new Date(e.fecha).toLocaleString('es-CR')+'</div>'+
            '<div style="color:'+color+';font-weight:700">'+(pr!=null?pr.toFixed(1)+' / 5':'—')+'</div></div>';
        }).join('')+'</div></div>';
    } else h += '<div class="vacio">Ninguna encuesta del período tiene cédula registrada.</div>';
    h += '</div>';

    /* --- Configuración de la encuesta --- */
    h += '<div class="card" style="padding:16px;margin-bottom:14px"><div class="sec" style="margin-top:0">'+ico('cog',13)+' Configuración de la encuesta</div>'+
      '<p style="font-size:12px;color:var(--dim);margin:0 0 14px;line-height:1.5">Cada tablet de encuestas se registra atada a una ventanilla o caja concreta (o a un canal remoto). La encuesta solo se habilita mientras esa ventanilla o caja tiene un turno en atención.</p>';
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px">';
    h += '<div><div class="sec" style="margin-top:0">Preguntas de la encuesta</div>';
    (cfgEnc.preguntas||[]).forEach(function(p,i){
      h += '<div class="fila"><span>'+(i+1)+'. '+esc(p.texto)+'</span>'+
        '<button class="btn" data-a="enc-quitar-pregunta" data-v="'+p.id+'" style="background:none;color:var(--dim);padding:3px">'+ico('basura',13)+'</button></div>';
    });
    if (!(cfgEnc.preguntas||[]).length) h += '<div class="vacio">Sin preguntas configuradas.</div>';
    h += '<div style="display:flex;gap:6px;margin-top:8px">'+
      '<input data-a="adm-nueva-pregunta" placeholder="Nueva pregunta para el asociado" value="'+esc(ui.nuevaPregunta||'')+'" style="flex:1;font-size:12.5px">'+
      '<button class="btn b-azul" data-a="adm-agregar-pregunta">'+ico('mas',14)+' Agregar</button></div></div>';
    h += '<div><div class="sec" style="margin-top:0">Canales remotos (sin ventanilla física)</div>';
    (cfgEnc.plataformas||[]).forEach(function(pl){
      h += '<div class="fila"><span>'+esc(pl)+'</span>'+
        '<button class="btn" data-a="enc-quitar-canal" data-v="'+esc(pl)+'" style="background:none;color:var(--dim);padding:3px">'+ico('basura',13)+'</button></div>';
    });
    if (!(cfgEnc.plataformas||[]).length) h += '<div class="vacio">Sin canales adicionales.</div>';
    h += '<div style="display:flex;gap:6px;margin-top:8px">'+
      '<input data-a="adm-nuevo-canal" placeholder="Ej. WhatsApp, Sitio web" value="'+esc(ui.nuevoCanal||'')+'" style="flex:1;font-size:12.5px">'+
      '<button class="btn b-azul" data-a="adm-agregar-canal">'+ico('mas',14)+' Agregar</button></div>'+
      '<p style="font-size:11px;color:var(--dim);margin:8px 0 0">Las ventanillas y cajas ya disponibles en cada sucursal no se agregan aquí: se eligen directo al registrar la tablet.</p></div>';
    h += '</div></div>';
    return h;
  }

  /* ============================== REPORTES ============================== */
  if (tabAct==='reportes'){
    const A = analizar();
    const serie = A.serie;
    const sf = function(campo){ return serie.map(function(x){ return x[campo]||0; }); };

    h += barraFiltroHTML();

    h += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">'+
      '<button class="btn b-azul" data-a="rep-imprimir">'+ico('monitor',14)+' Reporte PDF</button>'+
      '<button class="btn b-verde" data-a="rep-csv">'+ico('mas',14)+' Reporte Excel (CSV)</button>'+
      '</div>';

    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;margin-bottom:16px">'+
      kpiHTML('Fichas atendidas', A.atendidas, A.totalFichas+' emitidas en total', sf('atendidas'), 'var(--verde-osc)', {tipo:'kpi',clave:'atendidas'})+
      kpiHTML('Turnos perdidos', A.perdidas, A.totalFichas?((A.perdidas/A.totalFichas*100).toFixed(1)+'% del total'):'—', sf('perdidas'), 'var(--rojo)', {tipo:'kpi',clave:'perdidas'})+
      kpiHTML('Espera promedio', crono(A.esperaProm), 'Máxima '+crono(A.esperaMax), sf('esperaProm'), 'var(--naranja)', {tipo:'todos'})+
      kpiHTML('Atención promedio', crono(A.atencionProm), 'Máxima '+crono(A.atencionMax), sf('atencionProm'), 'var(--azul)', {tipo:'todos'})+
      kpiHTML('Fichas por desborde', A.desborde, 'Pagos enviados a ventanillas', null, 'var(--azul-cla)', {tipo:'kpi',clave:'desborde'})+
      kpiHTML('Tiempo detenido', crono(A.pausaSegTotal), A.pausas.length+' pausas en el período', sf('pausaSeg'), 'var(--rojo)')+
      '</div>';

    /* --- Tendencia de atención --- */
    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      tituloSeccionHTML('monitor','Fichas atendidas por '+(A.gran==='anio'?'año':(A.gran==='mes'?'mes':'día')),'var(--verde-osc)')+
      '<p style="font-size:11px;color:var(--dim);margin:-6px 0 10px">Clic sobre una barra para ver el detalle de ese período. La línea punteada marca la tendencia general.</p>'+
      chartBarrasHTML(serie, 'atendidas', {alto:210, gradiente:'var(--grad-verde)', clickTipo:'periodo', tendencia:true})+'</div>';

    /* ------------------- DESEMPEÑO POR PUESTO DE TRABAJO ------------------- */
    const puestos = Object.keys(A.porPuesto).map(function(k){ return A.porPuesto[k]; })
      .sort(function(a,b){ return b.atendidas-a.atendidas; });

    h += '<div class="card-rep" style="padding:18px;margin-bottom:16px">'+
      tituloSeccionHTML('user','Comportamiento y calidad de atención por puesto','var(--azul)')+
      '<p style="font-size:12px;color:var(--dim);margin:0 0 12px;line-height:1.5">Cada ventanilla y caja dentro del período seleccionado: volumen atendido, ritmo de atención, cumplimiento del estándar de espera, tiempo detenido y la calificación que dejaron los asociados atendidos ahí. Clic en una fila para ver su detalle.</p>';
    if (puestos.length){
      h += '<div style="overflow-x:auto"><div style="min-width:900px">'+
        '<div style="display:grid;grid-template-columns:1.3fr 78px 80px 92px 92px 84px 92px 96px 96px;font-size:11.5px;color:var(--dim);font-weight:700;padding:6px 2px;border-bottom:1px solid var(--borde)">'+
        '<div>Puesto</div><div>Fichas</div><div>Atendidas</div><div>Espera prom.</div><div>Atención prom.</div><div>Perdidas</div><div>Fuera estándar</div><div>T. detenido</div><div>Satisfacción</div></div>';
      puestos.forEach(function(g){
        const pe = g.esperas.length ? g.esperas.reduce(function(a,b){return a+b;},0)/g.esperas.length : 0;
        const pa = g.atenciones.length ? g.atenciones.reduce(function(a,b){return a+b;},0)/g.atenciones.length : 0;
        const st = g.sat.length ? g.sat.reduce(function(a,b){return a+b;},0)/g.sat.length : null;
        const stColor = st==null ? 'var(--dim)' : (SATISFACCION[Math.round(st)]||SATISFACCION[3]).color;
        h += '<div data-a="rep-detalle" data-t="puesto" data-v="'+esc(g.id)+'" style="cursor:pointer;display:grid;grid-template-columns:1.3fr 78px 80px 92px 92px 84px 92px 96px 96px;font-size:12.5px;padding:8px 2px;border-bottom:1px solid var(--gris);align-items:center">'+
          '<div><b>'+esc(g.nombre)+'</b><div style="font-size:10.5px;color:var(--dim)">'+(g.tipo==='caja'?'Caja · Pagos':'Ventanilla · Trámites')+'</div></div>'+
          '<div>'+g.total+'</div>'+
          '<div style="color:var(--verde-osc);font-weight:700">'+g.atendidas+'</div>'+
          '<div style="font-family:monospace">'+crono(pe)+'</div>'+
          '<div style="font-family:monospace">'+crono(pa)+'</div>'+
          '<div style="color:'+(g.perdidas?'var(--rojo)':'var(--dim)')+'">'+g.perdidas+'</div>'+
          '<div style="color:'+(g.fuera?'var(--rojo)':'var(--dim)')+'">'+g.fuera+'</div>'+
          '<div style="font-family:monospace;color:'+(g.pausaSeg?'var(--naranja)':'var(--dim)')+'">'+crono(g.pausaSeg)+'</div>'+
          '<div style="color:'+stColor+';font-weight:700">'+(st!=null?st.toFixed(1)+' / 5':'—')+'</div></div>';
      });
      h += '</div></div>';

    h += '</div>';

    /* --- Comparativos visuales por puesto --- */
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:16px">'+
      '<div class="card-rep" style="padding:18px">'+tituloSeccionHTML('rejilla','Fichas atendidas por puesto','var(--azul)')+
        chartBarrasHorizHTML(puestos.map(function(g){
          return {etiqueta:g.nombre, valor:g.atendidas, color:g.tipo==='caja'?'var(--naranja)':'var(--azul)', detalleTipo:'puesto', detalleClave:g.id};
        }))+'</div>'+
      '<div class="card-rep" style="padding:18px">'+tituloSeccionHTML('reloj','Tiempo de atención promedio por puesto','var(--azul-cla)')+
        chartBarrasHorizHTML(puestos.map(function(g){

          '<span style="display:flex;align-items:center;gap:4px;flex:none">'+
          '<select data-a="adm-anuncio-destino" data-v="'+esc(a.id)+'" style="font-size:11px;padding:3px 5px;width:150px">'+
            DESTINOS_ANUNCIO.map(function(d){ return '<option value="'+d[0]+'"'+((a.destino||'ambos')===d[0]?' selected':'')+'>'+d[1]+'</option>'; }).join('')+
          '</select>'+
          '<button class="btn" data-a="adm-quitar-anuncio" data-v="'+esc(a.id)+'" style="background:none;color:var(--dim);padding:3px">'+ico('basura',13)+'</button></span></div>';

/* ---------------- reportes de encuestas: filtro compartido, CSV e impresión ---------------- */
/* ============================================================================
   MOTOR DE MÉTRICAS — alimenta el dashboard y el reporte con los mismos números
   ============================================================================ */

/** Rango de fechas activo en el panel de reportes: inicio y corte inclusive. */
function rangoReporte(){
  /* Las exportaciones (PDF y CSV) usan exactamente el mismo período que los
     tableros en pantalla, para que los números del archivo y los de la
     pantalla nunca se contradigan. */
  const r = rangoPeriodo();
  return {ini:r.ini, fin:r.fin, plataforma:''};
}
/** Texto legible del período activo, para encabezar los reportes exportados. */
function etiquetaPeriodo(){
  const r = rangoPeriodo(), pf = filtroPeriodo();
  const f = function(d){ return d ? d.toLocaleDateString('es-CR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; };
  const suc = pf.sucursal ? (E.sucursales.find(function(s){ return s.id===pf.sucursal; })||{}).nombre : 'Todas las sucursales';
  return 'Del '+f(r.ini)+' al '+f(r.fin)+' · '+suc;
}
function dentroRango(fechaISO, r){
  const d = new Date(fechaISO);
  if (r.ini && d < r.ini) return false;
  if (r.fin && d > r.fin) return false;
  return true;
}
/** Nombre corto del funcionario: solo lo que está antes de @coopelesca.co.cr */
function usuarioCorto(correo){
  if (!correo) return '—';
  return String(correo).split('@')[0];
}

/** Calcula TODAS las métricas del período. Una sola fuente de verdad.
 *  filtro (opcional): {turno: fn(t)=>bool, encuesta: fn(e)=>bool} — acota el
 *  cálculo a un usuario/puesto/trámite/período puntual. Se piden por separado
 *  (en vez de derivar uno del otro) porque una encuesta no siempre viene
 *  ligada a un turno (hay encuestas independientes, sin turnoId) y filtrar
 *  solo por turnos las dejaría fuera por error — lo usa la ventana emergente
 *  de detalle (modalDetalleReporte) para poder imprimir o exportar SOLO esa
 *  porción, reutilizando exactamente el mismo motor de métricas. */
function calcularMetricas(filtro){
  const fTurno = filtro && filtro.turno, fEncuesta = filtro && filtro.encuesta;
  const r = rangoReporte();
  const turnos = E.turnos.filter(function(t){
    if (!dentroRango(t.horaCreado, r)) return false;
    if (r.plataforma){
      const p = t.puestoId ? puestoPorId(t.puestoId) : null;
      if (!p || p.nombre !== r.plataforma) return false;
    }
    if (fTurno && !fTurno(t)) return false;
    return true;
  });
  const encuestas = (E.encuestasRespuestas||[]).filter(function(x){
    if (!dentroRango(x.fecha, r)) return false;
    if (r.plataforma && x.plataforma !== r.plataforma) return false;
    if (fEncuesta && !fEncuesta(x)) return false;
    return true;
  });

  // --- Tipos de ficha ---
  const porTramite = {};
  turnos.forEach(function(t){
    const k = t.tramiteNombre||'—';
    if (!porTramite[k]) porTramite[k] = {tramiteId:t.tramiteId||null, total:0, preferenciales:0, atendidas:0, perdidas:0, esperas:[], atenciones:[], excedidas:0, dentroEstandar:0};
    const g = porTramite[k];
    g.total++;
    if (t.preferencial) g.preferenciales++;
    if (t.estado==='finalizado') g.atendidas++;
    if (t.estado==='ausente') g.perdidas++;
    if (t.horaAtencion){
      const espera = segDesde(t.horaCreado, t.horaAtencion);
      g.esperas.push(espera);
      // Estándar de espera (15 min para todo trámite salvo Pagos, que usa
      // su propio umbral de desborde) — solo cuenta, no dispara ninguna
      // acción automática, es para el reporte de Resumen.
      if (espera > estandarEsperaSeg(t.tramiteId)) g.excedidas++; else g.dentroEstandar++;
    }
    if (t.horaAtencion && t.horaFinalizado) g.atenciones.push(segDesde(t.horaAtencion, t.horaFinalizado));
  });

  // --- Tendencia diaria: fichas por trámite y encuestas por día, para los
  // gráficos de Resumen/Reportes/Encuestas. Se agrupa por fecha YYYY-MM-DD
  // dentro del rango filtrado (o los últimos 14 días si no hay filtro). ---
  const porDia = {};
  const diaClave = function(iso){ const d=new Date(iso); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
  turnos.forEach(function(t){
    const k = diaClave(t.horaCreado);
    if (!porDia[k]) porDia[k] = {fichas:0, atendidas:0, porTramite:{}, encuestas:0};
    porDia[k].fichas++;
    if (t.estado==='finalizado') porDia[k].atendidas++;
    const tk = t.tramiteId||'—';
    porDia[k].porTramite[tk] = (porDia[k].porTramite[tk]||0)+1;
  });
  encuestas.forEach(function(e){
    const k = diaClave(e.fecha);
    if (!porDia[k]) porDia[k] = {fichas:0, atendidas:0, porTramite:{}, encuestas:0};
    porDia[k].encuestas++;
  });

  // --- Tiempos globales ---
  const esperas = turnos.filter(t=>t.horaAtencion).map(t=>segDesde(t.horaCreado,t.horaAtencion));
  const atenciones = turnos.filter(t=>t.horaAtencion&&t.horaFinalizado).map(t=>segDesde(t.horaAtencion,t.horaFinalizado));
  const prom = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : 0;

  // --- Turnos perdidos (ausentes) ---
  const perdidos = turnos.filter(t=>t.estado==='ausente');

  // --- Derivaciones ---
  const derivaciones = {};
  turnos.forEach(function(t){
    (t.derivaciones||[]).forEach(function(d){
      const k = d.hacia||'—';
      derivaciones[k] = (derivaciones[k]||0)+1;
    });
  });

  // --- Atención por funcionario (usuario del correo institucional) ---
  const porUsuario = {};
  turnos.filter(t=>t.atendidoPor||t.puestoNombre).forEach(function(t){
    const k = t.atendidoPor ? usuarioCorto(t.atendidoPor) : (t.puestoNombre||'—');
    if (!porUsuario[k]) porUsuario[k] = {atendidas:0, atenciones:[]};
    if (t.estado==='finalizado') porUsuario[k].atendidas++;
    if (t.horaAtencion&&t.horaFinalizado) porUsuario[k].atenciones.push(segDesde(t.horaAtencion,t.horaFinalizado));
  });

  // --- Encuestas: respuestas por pregunta y por sensación ---
  const porPregunta = {};
  const porSensacion = {5:0,4:0,3:0,2:0,1:0};
  encuestas.forEach(function(e){
    e.respuestas.forEach(function(x){
      if (!porPregunta[x.texto]) porPregunta[x.texto] = {n:0, suma:0, dist:{5:0,4:0,3:0,2:0,1:0}};
      const q = porPregunta[x.texto];
      q.n++; q.suma += x.valor; q.dist[x.valor] = (q.dist[x.valor]||0)+1;
      porSensacion[x.valor] = (porSensacion[x.valor]||0)+1;
    });
  });

  const atendidos = turnos.filter(t=>t.estado==='finalizado');
  // Promedio general de satisfacción sobre todas las respuestas del período
  const valores = [];
  encuestas.forEach(function(e){ e.respuestas.forEach(function(x){ valores.push(x.valor); }); });
  const promedioSat = valores.length ? valores.reduce((a,b)=>a+b,0)/valores.length : 0;

  // --- Encuestas NO realizadas: fichas atendidas sin encuesta asociada,
  // con el puesto y el funcionario que las atendió, para dar seguimiento. ---
  const idsConEncuesta = new Set(encuestas.map(function(e){ return e.turnoId; }).filter(Boolean));
  const encuestasNoRealizadas = atendidos.filter(function(t){ return !idsConEncuesta.has(t.id); })
    .map(function(t){
      return {
        folio: t.folio, tramiteNombre: t.tramiteNombre, puestoNombre: t.puestoNombre||'—',
        atendidoPor: t.atendidoPor ? usuarioCorto(t.atendidoPor) : '—',
        horaFinalizado: t.horaFinalizado
      };
    })
    .sort(function(a,b){ return new Date(b.horaFinalizado)-new Date(a.horaFinalizado); });

  return {
    rango:r, turnos:turnos, encuestas:encuestas,
    porTramite:porTramite, porUsuario:porUsuario, derivaciones:derivaciones,
    porPregunta:porPregunta, porSensacion:porSensacion, porDia:porDia,
    encuestasNoRealizadas:encuestasNoRealizadas,
    totalFichas: turnos.length,
    atendidas: atendidos.length,
    perdidos: perdidos.length,
    preferenciales: turnos.filter(t=>t.preferencial).length,
    esperaProm: prom(esperas), esperaMax: esperas.length?Math.max.apply(null,esperas):0,
    atencionProm: prom(atenciones), atencionMax: atenciones.length?Math.max.apply(null,atenciones):0,
    encuestasHechas: encuestas.length,
    promedioSatisfaccion: promedioSat
  };
}

/** Agrupa M.porDia (calcularMetricas) en una serie ordenada, por día o por
 *  mes, lista para graficarse. */
function calcularSerieTendencia(M, modo){
  const dias = Object.keys(M.porDia||{}).sort();
  if (!dias.length) return [];
  if (modo==='mes'){
    const meses = {};
    dias.forEach(function(k){
      const mk = k.slice(0,7);
      if (!meses[mk]) meses[mk] = {clave:mk, fichas:0, atendidas:0, encuestas:0, porTramite:{}};
      const d = M.porDia[k];
      meses[mk].fichas += d.fichas; meses[mk].atendidas += d.atendidas; meses[mk].encuestas += d.encuestas;
      Object.keys(d.porTramite).forEach(function(tk){ meses[mk].porTramite[tk] = (meses[mk].porTramite[tk]||0)+d.porTramite[tk]; });
    });
    const nombres = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return Object.keys(meses).sort().map(function(mk){
      const p = mk.split('-');
      meses[mk].etiqueta = nombres[parseInt(p[1],10)-1]+' '+p[0];
      return meses[mk];
    });
  }
  return dias.map(function(k){
    const d = M.porDia[k], p = k.split('-');
    return {clave:k, etiqueta:p[2]+'/'+p[1], fichas:d.fichas, atendidas:d.atendidas, encuestas:d.encuestas, porTramite:d.porTramite};
  });
}

/** Gráfico de tendencia (barras verticales, sin librerías externas). Si
 *  apilarTramites=true, cada barra se divide por tipo de trámite con la
 *  tonalidad propia de colorTramite(); si no, es una barra simple del
 *  campo indicado ('fichas', 'atendidas' o 'encuestas'). */
function graficoTendenciaHTML(serie, campo, opciones){
  opciones = opciones||{};
  const apilar = !!opciones.apilarTramites;
  const alto = opciones.alto||190;
  if (!serie.length) return '<div class="vacio">Sin datos suficientes para el gráfico de tendencia.</div>';
  const visibles = serie.slice(-24);
  const max = Math.max.apply(null, visibles.map(function(x){ return apilar ? x.fichas : x[campo]; }).concat([1]));
  const tramitesUsados = {};
  if (apilar) visibles.forEach(function(x){ Object.keys(x.porTramite||{}).forEach(function(tk){ tramitesUsados[tk]=true; }); });
  const listaTramites = Object.keys(tramitesUsados);
  let h = '<div style="display:flex;align-items:flex-end;gap:6px;height:'+alto+'px;padding:6px 4px 26px;overflow-x:auto">';
  visibles.forEach(function(x){
    const total = apilar ? x.fichas : x[campo];
    const hpx = total ? Math.max(3, Math.round((total/max)*(alto-46))) : 2;
    h += '<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:28px;flex:1;height:100%;position:relative">';
    h += '<div style="font-size:10.5px;color:var(--dim);margin-bottom:3px;font-weight:600">'+(total||'')+'</div>';
    if (apilar && listaTramites.length){
      h += '<div style="width:100%;max-width:30px;height:'+hpx+'px;border-radius:4px 4px 0 0;overflow:hidden;display:flex;flex-direction:column-reverse">'+
        listaTramites.map(function(tk){
          const v = (x.porTramite||{})[tk]||0;
          if (!v) return '';
          const segH = Math.max(1, Math.round((v/total)*hpx));
          return '<div title="'+esc(tk)+': '+v+'" style="height:'+segH+'px;background:'+colorTramite(tk)+'"></div>';
        }).join('')+
      '</div>';
    } else {
      h += '<div style="width:100%;max-width:30px;height:'+hpx+'px;border-radius:4px 4px 0 0;background:var(--azul)"></div>';
    }
    h += '<div style="position:absolute;bottom:-22px;font-size:10.5px;color:var(--dim);white-space:nowrap">'+esc(x.etiqueta)+'</div>';
    h += '</div>';
  });
  h += '</div>';
  if (apilar && listaTramites.length){
    h += '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:4px">'+
      listaTramites.map(function(tk){
        const tr = E.tramites.find(function(x){ return x.id===tk; });
        return '<span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:2px;background:'+colorTramite(tk)+'"></span>'+esc(tr?tr.nombre:tk)+'</span>';
      }).join('')+'</div>';
  }
  return h;
}

/** Detalle de un día concreto de jornada: fichas de ese día agrupadas por
 *  trámite, con sus tiempos de espera y si excedieron el estándar
 *  (ESTANDAR_ESPERA_MIN, o el umbral propio de Pagos). Independiente del
 *  filtro de fechas de la pestaña Reportes. */
function resumenTramitesDia(fechaISO){
  const turnosDia = E.turnos.filter(function(t){
    const d = new Date(t.horaCreado);
    const k = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    return k===fechaISO;
  });
  const porTr = {};
  turnosDia.forEach(function(t){
    const k = t.tramiteNombre||'—';
    if (!porTr[k]) porTr[k] = {tramiteId:t.tramiteId||null, esperas:[], excedidas:0, dentro:0};
    if (t.horaAtencion){
      const esp = segDesde(t.horaCreado, t.horaAtencion);
      porTr[k].esperas.push(esp);
      if (esp > estandarEsperaSeg(t.tramiteId)) porTr[k].excedidas++; else porTr[k].dentro++;
    }
  });
  return {turnosDia:turnosDia, porTr:porTr};
}

function filtrarEncuestasActuales(){
  const per = ui.repPeriodo||'todo', fec = ui.repFecha||'', plat = ui.repPlataforma||'';
  return (E.encuestasRespuestas||[]).filter(function(r){
    if (plat && r.plataforma!==plat) return false;
    if (per==='todo' || !fec) return true;
    const d = new Date(r.fecha), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
    if (per==='dia')  return (y+'-'+m+'-'+day)===fec;
    if (per==='mes')  return (y+'-'+m)===fec;
    if (per==='anio') return String(y)===fec;
    return true;
  });
}

/** Sube una imagen o video desde el propio equipo y lo deja guardado de
 *  forma permanente (hasta que se elimine manualmente desde esta misma
 *  lista) — se convierte a datos embebidos (igual que el logo institucional
 *  incrustado en este archivo) en vez de una referencia temporal, así que
 *  sobrevive a recargar la página o cerrar el navegador. Ocupa espacio del
 *  almacenamiento local de este equipo: si el archivo es grande, puede no
 *  caber — en ese caso, use la ruta de red o la URL de arriba en su lugar. */
async function manejarArchivoAnuncio(el){
  const archivo = el.files && el.files[0];
  if (!archivo) return;
  const esVideo = archivo.type.indexOf('video')===0;
  const esImagen = archivo.type.indexOf('image')===0;
  if (!esVideo && !esImagen){ alert('Elija una imagen (JPEG/PNG) o un video (MP4).'); el.value=''; return; }

  const LIMITE = esVideo ? 8*1024*1024 : 3*1024*1024;
  if (archivo.size > LIMITE){
    alert('El archivo pesa '+(archivo.size/1024/1024).toFixed(1)+' MB — es demasiado pesado para subirlo. '+
      'Use uno de menos de '+(LIMITE/1024/1024)+' MB, o deje el archivo en una carpeta de red y escriba su ruta arriba, en «Dirección o ruta».');
    el.value=''; return;
  }

  const lector = new FileReader();
  lector.onload = async function(){
    try{
      await api('/api/config/anuncios', {method:'POST', body:{
        tipo: esVideo?'video':'imagen', src: lector.result, nombre: archivo.name,
        destino: ui.nuevoAnuncioDestino || 'ambos'
      }});
      await cargarCatalogo();
    }catch(e){
      alert(e.message||'No se pudo subir el anuncio.');
    }
    el.value = '';
    pintar();
  };
  lector.onerror = function(){ alert('No se pudo leer el archivo. Intente de nuevo.'); el.value=''; };
  lector.readAsDataURL(archivo);
}

/** filtro/tituloExtra (opcionales): para exportar SOLO el detalle de un
 *  usuario/puesto/trámite/período puntual desde la ventana emergente de
 *  detalle, en vez del reporte completo — mismo motor, mismo formato. */
function descargarCSVEncuestas(filtro, tituloExtra){
  const M = calcularMetricas(filtro);
  const L = [];
  const q = function(c){ const s=String(c==null?'':c); return /[",\n;]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; };
  const fila = function(arr){ L.push(arr.map(q).join(';')); };  // ; separa mejor en Excel en español
  const etRango = etiquetaPeriodo();

  fila(['COOPELESCA R.L. - Reporte de gestión de filas']);
  if (tituloExtra) fila(['Detalle', tituloExtra]);
  fila(['Período', etRango]);
  fila(['Emitido', new Date().toLocaleString('es-CR')]);
  fila([]);
  fila(['RESUMEN GENERAL']);
  fila(['Fichas emitidas', M.totalFichas]);
  fila(['Atendidas', M.atendidas]);
  fila(['Turnos perdidos', M.perdidos]);
  fila(['Preferenciales Ley 7600', M.preferenciales]);
  fila(['Espera promedio', crono(M.esperaProm)]);
  fila(['Espera máxima', crono(M.esperaMax)]);
  fila(['Atención promedio', crono(M.atencionProm)]);
  fila(['Encuestas realizadas', M.encuestasHechas]);
  fila(['Promedio general de satisfacción (1-5)', M.encuestasHechas?M.promedioSatisfaccion.toFixed(2):'—']);
  fila([]);

  fila(['FICHAS POR TIPO DE TRÁMITE']);
  fila(['Trámite','Total','% del total','Preferenciales','Atendidas','Perdidas','Espera promedio','Atención promedio']);
  Object.keys(M.porTramite).forEach(function(k){
    const g = M.porTramite[k];
    const pe = g.esperas.length ? g.esperas.reduce((a,b)=>a+b,0)/g.esperas.length : 0;
    const pa = g.atenciones.length ? g.atenciones.reduce((a,b)=>a+b,0)/g.atenciones.length : 0;
    fila([k, g.total, M.totalFichas?(g.total/M.totalFichas*100).toFixed(1):'0', g.preferenciales, g.atendidas, g.perdidas, crono(pe), crono(pa)]);
  });
  fila([]);

  fila(['TRÁMITES DERIVADOS']);
  fila(['Destino','Cantidad']);
  Object.keys(M.derivaciones).forEach(function(k){ fila([k, M.derivaciones[k]]); });
  fila([]);

  fila(['ATENCIÓN POR FUNCIONARIO']);
  fila(['Usuario','Atendidas','Atención promedio']);
  Object.keys(M.porUsuario).forEach(function(k){
    const u = M.porUsuario[k];
    const pa = u.atenciones.length ? u.atenciones.reduce((a,b)=>a+b,0)/u.atenciones.length : 0;
    fila([k, u.atendidas, crono(pa)]);
  });
  fila([]);

  fila(['RESPUESTAS POR PREGUNTA Y SENSACIÓN']);
  fila(['Pregunta','Respuestas','Promedio','Muy satisfecho','Satisfecho','Neutral','Insatisfecho','Muy insatisfecho']);
  Object.keys(M.porPregunta).forEach(function(k){
    const p = M.porPregunta[k];
    fila([k, p.n, (p.suma/p.n).toFixed(2), p.dist[5], p.dist[4], p.dist[3], p.dist[2], p.dist[1]]);
  });
  fila([]);

  fila(['DETALLE DE TURNOS']);
  fila(['Fecha','Hora','Folio','Trámite','Preferencial','Puesto','Usuario','Estado','Espera','Atención','Derivado a']);
  M.turnos.slice().sort(function(a,b){ return new Date(a.horaCreado)-new Date(b.horaCreado); }).forEach(function(t){
    const d = new Date(t.horaCreado);
    const esp = t.horaAtencion ? crono(segDesde(t.horaCreado,t.horaAtencion)) : '';
    const ate = (t.horaAtencion&&t.horaFinalizado) ? crono(segDesde(t.horaAtencion,t.horaFinalizado)) : '';
    const der = (t.derivaciones||[]).map(function(x){ return x.hacia; }).join(' / ');
    fila([d.toLocaleDateString('es-CR'), d.toLocaleTimeString('es-CR'), t.folio, t.tramiteNombre,
      t.preferencial?'Sí':'No', t.puestoNombre||'', usuarioCorto(t.atendidoPor), t.estado, esp, ate, der]);
  });
  fila([]);

  fila(['ENCUESTAS NO REALIZADAS']);
  fila(['Folio','Trámite','Puesto','Funcionario','Atendida']);
  M.encuestasNoRealizadas.forEach(function(x){
    fila([x.folio, x.tramiteNombre, x.puestoNombre, x.atendidoPor, hhmmss(x.horaFinalizado)]);
  });

  const csv = '\uFEFF'+L.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const sufijo = tituloExtra ? '-'+tituloExtra.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') : '';
  a.href = url; a.download = 'reporte-filas-coopelesca'+sufijo+'-'+ahora().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/** Reporte imprimible en horizontal. Las secciones se marcan como bloques
 *  indivisibles para que el navegador no parta una tabla a la mitad ni deje
 *  páginas en blanco al final. */
/** filtro/tituloExtra (opcionales): para imprimir SOLO el detalle de un
 *  usuario/puesto/trámite/período puntual desde la ventana emergente de
 *  detalle, en vez del reporte completo — mismo motor, mismo formato. */
function imprimirReporteEncuestas(filtro, tituloExtra){
  const M = calcularMetricas(filtro);
  const etRango = etiquetaPeriodo();
  const B='#D6DFE8', AZ='#0072BC', DIM='#6B7C8C';
  const celda = 'padding:5px 7px;border:1px solid '+B;
  const th = 'text-align:left;'+celda+';background:#EAF4FC;font-weight:700';

  const kpi = function(v,l,color){
    return '<div style="flex:1;min-width:96px;text-align:center;border:1px solid '+B+';border-radius:5px;padding:7px 4px">'+
      '<div style="font-size:17px;font-weight:800;color:'+(color||AZ)+'">'+v+'</div>'+
      '<div style="font-size:9.5px;color:'+DIM+'">'+l+'</div></div>';
  };
  // Barra proporcional dibujada con divs: se imprime igual en cualquier navegador
  const barra = function(et,val,tot,color){
    const pct = tot ? (val/tot*100) : 0;
    return '<div style="margin-bottom:5px">'+
      '<div style="display:flex;justify-content:space-between;font-size:10px"><span>'+esc(et)+'</span>'+
      '<span><b>'+val+'</b> ('+pct.toFixed(1)+'%)</span></div>'+
      '<div style="height:7px;background:#EDF1F5;border-radius:4px"><div style="height:7px;width:'+pct.toFixed(1)+'%;background:'+color+';border-radius:4px"></div></div></div>';
  };
  const seccion = function(titulo, contenido){
    return '<div style="break-inside:avoid;page-break-inside:avoid;margin-bottom:12px">'+
      '<div style="font-size:11px;font-weight:700;color:'+AZ+';border-bottom:2px solid '+AZ+';padding-bottom:3px;margin-bottom:7px;text-transform:uppercase;letter-spacing:.4px">'+titulo+'</div>'+
      contenido+'</div>';
  };

  let h = '<div style="font-family:Segoe UI,sans-serif;color:#1F2D3A;font-size:10.5px">';
  h += '<div style="display:flex;align-items:center;gap:12px;border-bottom:3px solid '+AZ+';padding-bottom:8px;margin-bottom:12px;break-inside:avoid">'+
    '<img src="'+esc(E.config.logoUrl||LOGO_COLOR)+'" style="height:34px">'+
    '<div style="flex:1"><div style="font-size:15px;font-weight:700">Reporte de gestión de filas'+(tituloExtra?' — '+esc(tituloExtra):'')+'</div>'+
    '<div style="font-size:10px;color:'+DIM+'">'+esc(etRango)+' · Emitido '+new Date().toLocaleString('es-CR')+'</div></div></div>';

  h += seccion('Resumen general',
    '<div style="display:flex;gap:6px;flex-wrap:wrap">'+
      kpi(M.totalFichas,'Fichas emitidas')+kpi(M.atendidas,'Atendidas','#6C9E2C')+
      kpi(M.perdidos,'Turnos perdidos','#D9534F')+kpi(M.preferenciales,'Preferenciales')+
      kpi(crono(M.esperaProm),'Espera prom.')+kpi(crono(M.atencionProm),'Atención prom.')+
      kpi(M.encuestasHechas,'Encuestas','#6C9E2C')+kpi(M.encuestasHechas?M.promedioSatisfaccion.toFixed(2):'—','Satisfacción','#6C9E2C')+
    '</div>');

  /* Dos columnas para aprovechar el formato horizontal */
  h += '<div style="display:flex;gap:14px;align-items:flex-start">';

  const clavesTram = Object.keys(M.porTramite).sort(function(a,b){ return M.porTramite[b].total-M.porTramite[a].total; });
  let colA = seccion('Porcentaje por tipo de trámite',
    clavesTram.length ? clavesTram.map(function(k){ return barra(k, M.porTramite[k].total, M.totalFichas, AZ); }).join('')
      : '<div style="color:'+DIM+'">Sin fichas en el período.</div>');

  colA += seccion('Tiempos y pérdidas por trámite',
    clavesTram.length ? '<table style="width:100%;border-collapse:collapse;font-size:9.5px">'+
      '<tr><th style="'+th+'">Trámite</th><th style="'+th+'">Total</th><th style="'+th+'">Espera</th><th style="'+th+'">Atención</th><th style="'+th+'">Perdidos</th></tr>'+
      clavesTram.map(function(k){
        const g=M.porTramite[k];

        const pa=g.atenciones.length?g.atenciones.reduce((a,b)=>a+b,0)/g.atenciones.length:0;
        return '<tr><td style="'+celda+'">'+esc(k)+'</td><td style="'+celda+'">'+g.total+'</td>'+

          '<td style="'+celda+'">'+g.perdidas+'</td></tr>';
      }).join('')+'</table>' : '<div style="color:'+DIM+'">Sin datos.</div>');

  const clavesDer = Object.keys(M.derivaciones);
  const totalDer = clavesDer.reduce(function(a,k){ return a+M.derivaciones[k]; },0);
  colA += seccion('Trámites derivados',
    clavesDer.length ? clavesDer.map(function(k){ return barra(k, M.derivaciones[k], totalDer, '#F0A02C'); }).join('')
      : '<div style="color:'+DIM+'">Sin derivaciones.</div>');

  h += '<div style="flex:1;min-width:0">'+colA+'</div>';

  const totalSens=[5,4,3,2,1].reduce(function(a,v){ return a+(M.porSensacion[v]||0); },0);
  let colB = seccion('Sensación marcada en encuestas',
    totalSens ? [5,4,3,2,1].map(function(v){ return barra(SATISFACCION[v].etiqueta, M.porSensacion[v]||0, totalSens, SATISFACCION[v].color); }).join('')

  colB += seccion('Respuestas por pregunta',
    clavesPreg.length ? '<table style="width:100%;border-collapse:collapse;font-size:9.5px">'+

      [5,4,3,2,1].map(function(v){ return '<th style="'+th+';text-align:center">'+SATISFACCION[v].etiqueta.split(' ')[0]+(v===5||v===1?'*':'')+'</th>'; }).join('')+'</tr>'+
      clavesPreg.map(function(k){ const p=M.porPregunta[k];
        return '<tr><td style="'+celda+'">'+esc(k)+'</td><td style="'+celda+'">'+p.n+'</td>'+
          '<td style="'+celda+'">'+(p.suma/p.n).toFixed(2)+'</td>'+
          [5,4,3,2,1].map(function(v){ return '<td style="'+celda+';text-align:center">'+p.dist[v]+'</td>'; }).join('')+'</tr>';
      }).join('')+'</table><div style="font-size:8.5px;color:'+DIM+';margin-top:3px">* Muy satisfecho / Muy insatisfecho</div>'
      : '<div style="color:'+DIM+'">Sin respuestas.</div>');

  const clavesUsr = Object.keys(M.porUsuario).sort(function(a,b){ return M.porUsuario[b].atendidas-M.porUsuario[a].atendidas; });
  colB += seccion('Atención por funcionario',
    clavesUsr.length ? '<table style="width:100%;border-collapse:collapse;font-size:9.5px">'+
      '<tr><th style="'+th+'">Usuario</th><th style="'+th+'">Atendidas</th><th style="'+th+'">Atención prom.</th></tr>'+
      clavesUsr.map(function(k){ const u=M.porUsuario[k];
        const pa=u.atenciones.length?u.atenciones.reduce((a,b)=>a+b,0)/u.atenciones.length:0;
        return '<tr><td style="'+celda+'">'+esc(k)+'</td><td style="'+celda+'">'+u.atendidas+'</td>'+
          '<td style="'+celda+'">'+crono(pa)+'</td></tr>';
      }).join('')+'</table>' : '<div style="color:'+DIM+'">Sin registros.</div>');

  const noReal = M.encuestasNoRealizadas;
  colB += seccion('Encuestas no realizadas ('+noReal.length+')',
    noReal.length ? '<table style="width:100%;border-collapse:collapse;font-size:9.5px">'+
      '<tr><th style="'+th+'">Folio</th><th style="'+th+'">Puesto</th><th style="'+th+'">Funcionario</th></tr>'+
      noReal.slice(0,15).map(function(x){
        return '<tr><td style="'+celda+'">'+esc(x.folio)+'</td><td style="'+celda+'">'+esc(x.puestoNombre)+'</td>'+
          '<td style="'+celda+'">'+esc(x.atendidoPor)+'</td></tr>';
      }).join('')+'</table>'+(noReal.length>15?'<div style="font-size:8.5px;color:'+DIM+';margin-top:3px">Mostrando 15 de '+noReal.length+' — el detalle completo queda en el Excel.</div>':'')
      : '<div style="color:'+DIM+'">Todas las fichas atendidas tienen encuesta.</div>');


  h += '<div style="flex:1;min-width:0">'+colB+'</div>';
  h += '</div>';
  h += '<div style="margin-top:10px;padding-top:6px;border-top:1px solid '+B+';font-size:9px;color:'+DIM+';text-align:center;break-inside:avoid">COOPELESCA R.L. · Sirviendo con el Corazón</div>';
  h += '</div>';

  const zona = document.getElementById('print-area');
  zona.innerHTML = h;
  fijarOrientacion('reporte');
  setTimeout(function(){ window.print(); }, 80);
}
